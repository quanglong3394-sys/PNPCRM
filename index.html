function promoDiscount(p, sub, date, channel){
  if(!p) return {d:0, msg:''};
  if(date<p.start||date>p.end) return {d:0, msg:`Ngày đơn nằm ngoài thời gian CTKM (${fmtDate(p.start)} – ${fmtDate(p.end)}).`};
  if(p.channels&&p.channels.length&&!p.channels.includes(channel)) return {d:0, msg:`CTKM chỉ áp dụng cho kênh: ${p.channels.join(', ')}.`};
  if(p.minOrder && sub<p.minOrder) return {d:0, msg:`Đơn chưa đạt giá trị tối thiểu ${money(p.minOrder)}.`};
  let d = p.type==='percent' ? sub*(p.value||0)/100 : (p.value||0);
  if(p.maxDiscount) d=Math.min(d,p.maxDiscount);
  d=Math.min(Math.round(d), sub);
  return {d, msg:'', ok:true};
}

function runReport(){
  const R=presetRange(repCfg.preset, repCfg.from, repCfg.to);
  const orders=S.orders.filter(o=>inRange(o,R) && (repCfg.status==='all' || (repCfg.status==='done'? o.status==='Hoàn tất' : counted(o))) && (!repCfg.channel||o.channel===repCfg.channel));
  return aggregate(orders, repCfg.dim);
}

function promoPerf(p){ return cached('pp-'+p.id, ()=>{
  const t=today(), end=p.end<t? p.end : t;
  const used=S.orders.filter(o=>o.promoId===p.id && counted(o));
  const revenue=used.reduce((s,o)=>s+(o.total||0),0), cost=used.reduce((s,o)=>s+(o.promoDiscount||0),0);
  const cs=custStats();
  const newCust=new Set(used.filter(o=>cs.get(o.customerId)?.first===o.date).map(o=>o.customerId)).size;
  const custs=new Set(used.map(o=>o.customerId)).size;
  let uplift=null, during=0, base=0;
  if(p.start<=t){ const days=diffDays(p.start,end)+1; const sumR=(f,to)=>S.orders.filter(o=>counted(o)&&o.date>=f&&o.date<=to).reduce((s,o)=>s+(o.total||0),0);
    during=sumR(p.start,end)/days; base=sumR(addDays(p.start,-days), addDays(p.start,-1))/days; uplift= base? during/base-1 : null; }
  const outside = S.orders.filter(o=>counted(o)&&!o.promoId&&o.date>=p.start&&o.date<=end);
  const aovOut = outside.length? outside.reduce((s,o)=>s+o.total,0)/outside.length : 0;
  return {orders:used.length, revenue, cost, newCust, custs, uplift, during, base, aov: used.length? revenue/used.length:0, aovOut,
    budgetPct: p.budget? cost/p.budget : null, targetPct: p.targetRevenue? revenue/p.targetRevenue : null, ordersPct: p.targetOrders? used.length/p.targetOrders : null};
}); }

    const prog=(lbl,v,fill)=> v==null? '' : `<div class="prog-row"><span>${lbl}</span><div class="progress"><i style="width:${Math.min(100,v*100)}%;--fill:${fill}"></i></div><b>${pct(v,0)}</b></div>`;
    const bfill=v=>v>1?'var(--bad)':v>.85?'var(--warn)':'var(--c2)';
    $('#pCards').innerHTML = ps.map(p=>{ const [st,cls]=promoStatus(p);
      if(isFO(p)){ const f=foPerf(p);
        return `<button class="panel pcard ${S.ui.promo.sel===p.id?'on':''}" data-p="${esc(p.id)}">
        <div class="pcard-top"><div><span class="chip plain st-new">First order</span><div class="mono" style="font-weight:600;margin-top:4px">${esc(p.code)}</div><div class="cell-main">${esc(p.name)}</div><div class="cell-sub">${monthMM(p.start.slice(0,7))} – ${monthMM(p.end.slice(0,7))}${(p.products||[]).length?' · '+esc(p.products.join(', ')):''}</div></div><span class="chip ${cls}">${st}</span></div>
        <div class="pstats"><div><b>${f.countedCustomers}/${f.customers}</b><span>Khách</span></div><div><b>${num(f.counted)}</b><span>Tấm ghi nhận</span></div><div><b>${moneyShort(f.cost)}</b><span>Chi phí hỗ trợ</span></div></div>
        ${prog('Mục tiêu KH', f.targetPct, 'var(--accent)')}${prog('Ngân sách', f.budgetPct, bfill(f.budgetPct))}
      </button>`; }
      if(isTour(p)){ const f=tourPerf(p);
        return `<button class="panel pcard ${S.ui.promo.sel===p.id?'on':''}" data-p="${esc(p.id)}">
        <div class="pcard-top"><div><span class="chip plain st-ship">Tour promotion</span><div class="mono" style="font-weight:600;margin-top:4px">${esc(p.code)}</div><div class="cell-main">${esc(p.name)}</div><div class="cell-sub">${monthMM(p.start.slice(0,7))} – ${monthMM(p.end.slice(0,7))}${(p.products||[]).length?' · '+esc(p.products.join(', ')):''}</div></div><span class="chip ${cls}">${st}</span></div>
        <div class="pstats"><div><b>${num(f.counted)}</b><span>Tấm ghi nhận</span></div><div><b>${f.qualified}/${f.participants}</b><span>Cửa hàng đạt</span></div><div><b>${moneyShort(f.cost)}</b><span>Chi phí dự kiến</span></div></div>
        ${prog('Mục tiêu SL', f.targetPct, 'var(--accent)')}${prog('Ngân sách', f.budgetPct, bfill(f.budgetPct))}
      </button>`; }
      const f=promoPerf(p);
      return `<button class="panel pcard ${S.ui.promo.sel===p.id?'on':''}" data-p="${esc(p.id)}">
        <div class="pcard-top"><div><div class="mono" style="font-weight:600">${esc(p.code)}</div><div class="cell-main">${esc(p.name)}</div><div class="cell-sub">${fmtDate(p.start)} – ${fmtDate(p.end)} · ${p.type==='percent'? 'Giảm '+p.value+'%' : 'Giảm '+moneyShort(p.value)}</div></div><span class="chip ${cls}">${st}</span></div>
        <div class="pstats"><div><b>${f.orders}</b><span>Đơn</span></div><div><b>${moneyShort(f.revenue)}</b><span>Doanh thu</span></div><div><b>${f.cost? (f.revenue/f.cost).toFixed(1).replace('.',','):'—'}</b><span>DT / 1đ KM</span></div></div>
        ${prog('Mục tiêu DT', f.targetPct, 'var(--accent)')}${prog('Ngân sách', f.budgetPct, bfill(f.budgetPct))}
      </button>`; }).join('');
    $$('#pCards [data-p]').forEach(b=>b.onclick=()=>{ S.ui.promo.sel=b.dataset.p; update(); $('#pDetail').scrollIntoView({behavior:'smooth',block:'start'}); });
    const sel=promoMap().get(S.ui.promo.sel);
    isFO(sel) ? renderFODetail(sel) : isTour(sel) ? renderTourDetail(sel) : renderPromoDetail(sel);
  }
};
function renderPromoDetail(p){
  const el=$('#pDetail'); el.hidden=false; const f=promoPerf(p), [st,cls]=promoStatus(p);
  const used=S.orders.filter(o=>o.promoId===p.id&&counted(o));
  const prods=aggregate(used,'product').rows.slice(0,5), chans=aggregate(used,'channel').rows;
  el.innerHTML = `<div class="panel-h" style="flex-wrap:wrap"><div><h2><span class="mono">${esc(p.code)}</span> · ${esc(p.name)}</h2><div class="muted small">${fmtDate(p.start)} – ${fmtDate(p.end)} · <span class="chip ${cls}">${st}</span> ${p.channels&&p.channels.length? '· Kênh: '+esc(p.channels.join(', ')) : '· Mọi kênh'}${p.minOrder?' · Đơn tối thiểu '+money(p.minOrder):''}</div></div>
    <div class="actions"><button class="btn sm" id="pdOrders">Xem đơn áp dụng</button><button class="btn sm" data-w id="pdEdit">${icon('edit')} Sửa</button><button class="btn sm danger" data-w id="pdDel">${icon('trash')} Xóa</button></div></div>
    <div class="panel-b grid">
      <div class="grid g-kpi">${[
        ['Doanh thu từ đơn KM', money(f.revenue), p.targetRevenue? 'Mục tiêu '+money(p.targetRevenue):''],
        ['Số đơn áp dụng', num(f.orders), p.targetOrders? 'Mục tiêu '+num(p.targetOrders)+' đơn':''],
        ['Chi phí giảm giá', money(f.cost), p.budget? 'Ngân sách '+money(p.budget)+' · đã dùng '+pct(f.budgetPct,0):''],
        ['DT / 1đ khuyến mãi', f.cost? (f.revenue/f.cost).toFixed(2).replace('.',',')+' đ':'—', 'Chi phí KM / DT: '+(f.revenue? pct(f.cost/f.revenue):'—')],
        ['Tăng trưởng DT/ngày', f.uplift==null? '—' : (f.uplift>=0?'+':'')+pct(f.uplift), f.uplift==null? (p.start>today()?'Chưa bắt đầu':'Thiếu số liệu kỳ trước') : moneyShort(f.during)+'/ngày so với '+moneyShort(f.base)+'/ngày trước CT'],
        ['Khách mới thu hút', num(f.newCust), num(f.custs)+' khách dùng mã'],
        ['Giá trị đơn KM TB', money(f.aov), f.aovOut? 'Đơn không KM cùng kỳ: '+money(f.aovOut):'']
      ].map(([l,v,s])=>`<div class="panel kpi" style="background:var(--surface-2);border-color:var(--line-2)"><span class="lbl">${l}</span><span class="val" style="font-size:1.2rem">${v}</span><span class="delta muted">${s}</span></div>`).join('')}</div>
      <div><h3 style="margin-bottom:8px">Doanh thu theo ngày: trước, trong và sau CTKM</h3><div class="chart-box"><canvas id="cPromoDay"></canvas></div></div>
      <div class="grid g-2e">
        <div><h3 style="margin-bottom:8px">Sản phẩm bán kèm mã</h3>${prods.length? `<div class="tbl-wrap"><table><thead><tr><th>Sản phẩm</th><th class="num">SL</th><th class="num">Doanh thu</th></tr></thead><tbody>${prods.map(r=>`<tr><td>${esc(r.label)}</td><td class="num">${num(r.qty)}</td><td class="num">${money(r.revenue)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Chưa có đơn áp dụng.</p>'}</div>
        <div><h3 style="margin-bottom:8px">Theo kênh bán</h3>${chans.length? `<div class="bar-list">${chans.map((r,i)=>`<div class="bar-row"><span>${esc(r.label)}</span><div class="bar-track"><div class="bar-fill" style="width:${r.share*100}%;--fill:var(--c${i%6+1})"></div></div><b class="num">${pct(r.share,0)}</b></div>`).join('')}</div>`:'<p class="muted">Chưa có đơn áp dụng.</p>'}</div>
      </div>
      ${p.note?`<p class="muted small" style="margin:0">Ghi chú: ${esc(p.note)}</p>`:''}
    </div>`;
  const t=today(), span=diffDays(p.start,p.end)+1, pad2=Math.min(21,Math.max(7,Math.round(span/2)));
  const f0=addDays(p.start,-pad2), t0=[addDays(p.end,pad2), t].sort()[0];
  const keys=[]; for(let d=f0; d<=t0; d=addDays(d,1)) keys.push(d);
  if(keys.length>1){
    const by=(flt)=>{ const m=new Map(); S.orders.filter(o=>counted(o)&&o.date>=f0&&o.date<=t0&&flt(o)).forEach(o=>m.set(o.date,(m.get(o.date)||0)+o.total)); return keys.map(k=>m.get(k)||0); };
    mkChart('cPromoDay',{type:'bar', data:{labels:keys.map(k=>k.slice(8)+'/'+k.slice(5,7)), datasets:[
      {label:'Đơn dùng '+p.code, data:by(o=>o.promoId===p.id), backgroundColor:series(0), stack:'s'},
      {label:'Đơn khác', data:by(o=>o.promoId!==p.id), backgroundColor:tok('--line'), stack:'s'}]},
      options:{scales:{x:{stacked:true, grid:{display:false}, ticks:{maxRotation:0, autoSkipPadding:10, color:c=>{const k=keys[c.index]; return k>=p.start&&k<=p.end? tok('--accent') : tok('--muted');}}}, y:{stacked:true, ticks:{callback:moneyTick}}}, plugins:{tooltip:{callbacks:{label:tipMoney}}}}});
  } else $('#cPromoDay').parentElement.innerHTML='<div class="empty">CTKM chưa bắt đầu, chưa có số liệu theo ngày.</div>';
  $('#pdEdit').onclick=()=>promoForm(p);
  $('#pdOrders').onclick=()=>{ Object.assign(S.ui.ord,{promo:p.id, preset:'all', status:'', channel:'', q:'', missing:false}); location.hash='orders'; };
  $('#pdDel').onclick=()=>confirmBox('Xóa CTKM '+p.code+'?', f.orders? `${f.orders} đơn đã dùng mã này. Đơn vẫn giữ nguyên số tiền nhưng không còn liên kết tới CTKM.` : 'Thao tác này không hoàn tác được.', 'Xóa CTKM', async()=>{ if(await write(db=>db.collection('promos').doc(p.id).delete(),'Đã xóa CTKM')){ S.ui.promo.sel=null; closeOverlay(); } });
}
function promoForm(p){

  if(!e.kind) e.kind='discount'; if(!e.tiers||!e.tiers.length) e.tiers=[{min:0,reward:'',slots:1,cost:0}];

  const K=(...ks)=>`data-kind="${ks.join(' ')}" ${ks.includes(e.kind)?'':'hidden'}`;

    <label class="field"><span>Mã CTKM *</span><input type="text" id="fp-code" class="mono" value="${esc(e.code||'')}" placeholder="VD: TOUR-HPC26"></label>
    <label class="field"><span>Tên chương trình *</span><input type="text" id="fp-name" value="${esc(e.name||'')}"></label>
    <label class="field"><span>Bắt đầu</span><input type="date" id="fp-start" value="${esc(e.start)}"></label>
    <label class="field"><span>Kết thúc</span><input type="date" id="fp-end" value="${esc(e.end)}"></label>
    <label class="field" ${K('tour','first_order')}><span>Sản phẩm tính sản lượng (cách nhau dấu phẩy, trống = tất cả)</span><input type="text" id="fp-prods" list="dl-tprod" value="${esc((e.products||[]).join(', '))}"></label>
    <label class="field" ${K('tour','first_order')}><span>Nhà phân phối áp dụng (trống = tất cả)</span><input type="text" id="fp-npps" list="dl-tnpp" value="${esc((e.distributors||[]).join(', '))}"></label>
    <label class="field" ${K('tour')}><span>Mục tiêu sản lượng (tấm)</span><input type="number" min="0" id="fp-tvol" value="${e.targetVolume||''}"></label>
    <label class="check" ${K('tour','first_order')} style="align-self:end;padding-bottom:8px"><input type="checkbox" id="fp-req" ${e.requireCode!==false?'checked':''}> Chỉ ghi nhận sản lượng của khách đã đã duyệt</label>
    <label class="field" ${K('first_order')}><span>Hỗ trợ / tấm (₫)</span><input type="number" min="0" step="1000" id="fp-unit" value="${e.supportPerUnit||''}"></label>
    <label class="field" ${K('first_order')}><span>Hỗ trợ cố định / khách (₫)</span><input type="number" min="0" step="100000" id="fp-fixed" value="${e.supportFixed||''}"></label>
    <label class="field" ${K('first_order')}><span>Quà tặng (tên hàng hóa)</span><input type="text" id="fp-vitem" value="${esc(e.voucherItem||VOUCHER_DEFAULT.item)}"></label>
    <label class="field" ${K('first_order')}><span>Mệnh giá voucher (₫)</span><input type="number" min="0" step="10000" id="fp-vval" value="${e.voucherValue||VOUCHER_DEFAULT.value}"></label>
    <label class="field" ${K('first_order')}><span>Mục tiêu số khách first order</span><input type="number" min="0" id="fp-tcust" value="${e.targetCustomers||''}"></label>
    <p class="muted small full" ${K('first_order')} style="margin:0">Đơn đầu tiên = tháng đầu tiên khách có sản lượng trong báo cáo, nằm trong thời gian chương trình. Sản lượng này không cộng vào tour promotion.</p>
    <div class="field full" ${K('tour')}><span>Mức thưởng theo sản lượng tích lũy trong thời gian chương trình</span>
      <div class="tbl-wrap"><table class="items-tbl"><thead><tr><th class="num" style="width:110px">Từ (tấm)</th><th style="min-width:180px">Phần thưởng</th><th class="num" style="width:80px">Số suất</th><th class="num" style="width:140px">Chi phí / suất (₫)</th><th></th></tr></thead><tbody id="fp-tiers"></tbody></table></div>
      <button class="btn sm" type="button" id="fp-addTier" style="margin-top:6px;align-self:flex-start">${icon('plus')} Thêm mức</button></div>
    <label class="field" ${K('discount')}><span>Hình thức giảm</span><select id="fp-type"><option value="percent" ${e.type==='percent'?'selected':''}>Giảm theo %</option><option value="fixed" ${e.type==='fixed'?'selected':''}>Giảm số tiền cố định</option></select></label>
    <label class="field" ${K('discount')}><span>Mức giảm (% hoặc ₫)</span><input type="number" min="0" id="fp-value" value="${e.value||0}"></label>
    <label class="field" ${K('discount')}><span>Giảm tối đa (₫)</span><input type="number" min="0" step="1000" id="fp-max" value="${e.maxDiscount||''}" placeholder="Không giới hạn"></label>
    <label class="field" ${K('discount')}><span>Đơn tối thiểu (₫)</span><input type="number" min="0" step="1000" id="fp-min" value="${e.minOrder||''}" placeholder="Không yêu cầu"></label>
    <label class="field" ${K('discount')}><span>Mục tiêu doanh thu (₫)</span><input type="number" min="0" step="1000000" id="fp-target" value="${e.targetRevenue||''}"></label>
    <label class="field" ${K('discount')}><span>Mục tiêu số đơn</span><input type="number" min="0" id="fp-tord" value="${e.targetOrders||''}"></label>
    <div class="field full" ${K('discount')}><span>Áp dụng cho kênh (để trống = mọi kênh)</span><div class="metric-pick">${CHANNELS.map(c=>`<label><input type="checkbox" data-ch value="${c}" ${(e.channels||[]).includes(c)?'checked':''}>${c}</label>`).join('')}</div></div>
    <label class="field"><span>Ngân sách (₫)</span><input type="number" min="0" step="100000" id="fp-budget" value="${e.budget||''}"></label>
    <label class="field full"><span>Ghi chú</span><textarea id="fp-note">${esc(e.note||'')}</textarea></label></div>
    <datalist id="dl-tprod">${uniq([...S.allocations.map(a=>a.product),...S.catalog.map(c=>c.name)]).map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
    <datalist id="dl-tnpp">${uniq([...nppAll().map(p=>p.name),...S.allocations.map(a=>a.distributor)]).map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`,
    foot:`<button class="btn" data-close>Hủy</button><button class="btn primary" id="fpSave">${icon('save')} Lưu CTKM</button>`,
    mount(){
      const ov=$('#overlay'), tb=$('#fp-tiers');
      $('#fp-kind').onchange=ev=>{ e.kind=ev.target.value; $$('[data-kind]',ov).forEach(el=>el.hidden=!el.dataset.kind.split(' ').includes(e.kind)); };
      const drawT=()=>{ tb.innerHTML=e.tiers.map((t,i)=>`<tr data-i="${i}"><td><input type="number" min="0" class="num" data-t="min" value="${t.min||''}"></td><td><input type="text" data-t="reward" value="${esc(t.reward||'')}" placeholder="VD: 1 suất tour Phú Quốc 3N2Đ"></td><td><input type="number" min="1" class="num" data-t="slots" value="${t.slots||1}"></td><td><input type="number" min="0" step="100000" class="num" data-t="cost" value="${t.cost||''}"></td><td><button class="icon-btn" type="button" data-rmt>${icon('x')}</button></td></tr>`).join(''); };
      tb.addEventListener('input',ev=>{ const i=+ev.target.closest('tr').dataset.i, k=ev.target.dataset.t; e.tiers[i][k]= k==='reward'? ev.target.value : (+ev.target.value||0); });
      tb.addEventListener('click',ev=>{ if(!ev.target.closest('[data-rmt]')) return; e.tiers.splice(+ev.target.closest('tr').dataset.i,1); if(!e.tiers.length) e.tiers.push({min:0,reward:'',slots:1,cost:0}); drawT(); });
      $('#fp-addTier').onclick=()=>{ e.tiers.push({min:0,reward:'',slots:1,cost:0}); drawT(); };
      drawT();
      $('#fpSave').onclick=async()=>{
        const v=id=>$('#fp-'+id).value.trim(), n=id=>+$('#fp-'+id).value||0, list=id=>v(id).split(',').map(x=>x.trim()).filter(Boolean);
        const code=v('code').toUpperCase(); if(!code||!v('name')) return toast('Vui lòng nhập mã và tên CTKM.','bad');
        if(S.promos.some(x=>x.code===code&&x.id!==e.id)) return toast('Mã CTKM đã tồn tại.','bad');
        if(!v('start')||!v('end')||v('end')<v('start')) return toast('Ngày kết thúc phải sau ngày bắt đầu.','bad');
        const common={code, name:v('name'), start:v('start'), end:v('end'), budget:n('budget')||null, note:v('note'), updatedAt:stamp()};
        let data;
        if(e.kind==='first_order'){
          if(!n('unit') && !n('fixed') && !n('vval')) return toast('Nhập mức hỗ trợ hoặc mệnh giá voucher.','bad');
          data={...e, ...common, kind:'first_order', products:list('prods'), distributors:list('npps'), requireCode:$('#fp-req').checked, supportPerUnit:n('unit')||null, supportFixed:n('fixed')||null, targetCustomers:n('tcust')||null, voucherItem:v('vitem')||VOUCHER_DEFAULT.item, voucherValue:n('vval')||null};
        } else if(e.kind==='tour'){
          const tiers=e.tiers.filter(t=>+t.min>0).map(t=>({min:+t.min, reward:(t.reward||'').trim(), slots:+t.slots||1, cost:+t.cost||0})).sort((a,b)=>a.min-b.min);
          if(!tiers.length) return toast('Cần ít nhất một mức thưởng có số tấm tối thiểu.','bad');
          data={...e, ...common, kind:'tour', products:list('prods'), distributors:list('npps'), targetVolume:n('tvol')||null, requireCode:$('#fp-req').checked, tiers};
        } else {
          if($('#fp-type').value==='percent' && n('value')>100) return toast('Mức giảm theo % không vượt quá 100.','bad');
          data={...e, ...common, kind:'discount', type:$('#fp-type').value, value:n('value'), maxDiscount:n('max')||null, minOrder:n('min')||null, targetRevenue:n('target')||null, targetOrders:n('tord')||null, channels:$$('[data-ch]:checked',ov).map(x=>x.value)};
        }
        delete data.id;
        const ref = S.db && (p? S.db.collection('promos').doc(p.id) : S.db.collection('promos').doc());
        if(await write(()=>ref.set(data), p?'Đã cập nhật CTKM':'Đã tạo CTKM '+code)){ S.ui.promo.sel=ref.id; closeOverlay(); }
      };
    }});
}

  customers:{label:'Khách hàng', desc:'3 phần: thông tin khách hàng (tên, MST, địa chỉ, NPP), sản lượng từng tháng (theo năm đang chọn ở mục Khách hàng), sản lượng tham gia từng CTKM.'},

  documents:{label:'Sổ chứng từ', desc:'Các file đã tải lên: báo cáo phân bổ, phiếu đăng ký mã, danh mục khách hàng, kèm thời gian và nội dung.', period:true},
  vouchers:{label:'Giao voucher first order', desc:'Theo đúng mẫu sheet “Nhập liệu Thông tin khách hàng”: Tên KH, Địa chỉ, MST, Tên hàng hóa, ĐVT, Số lượng, Mệnh giá, Số Seri, Ngày tặng.'},
  registrations:{label:'Đăng ký PNP', desc:'Phiếu đăng ký PNP Customer Code: thông tin khách, loại hình, NPP, sales, mã PNP, trạng thái, sản lượng.'},
  allocations:{label:'Phân bổ sản lượng', desc:'Mỗi dòng một cửa hàng trong báo cáo tháng của NPP: mã PNP, khu vực, số tấm, có được ghi nhận CTKM hay không.', period:true},
};
function datasetRows(ds, orders, allocs){
  const R=presetRange(S.ui.exp.preset, S.ui.exp.from, S.ui.exp.to);
  const ords = orders || ordersSorted().filter(o=>inRange(o,R));
  const cs=custStats();
  switch(ds){
    case 'orders': return ords.map(o=>({'Mã đơn':o.code,'Ngày':fmtDate(o.date),'Mã KH':cust(o.customerId)?.code||'','Khách hàng':custName(o.customerId),'Kênh':o.channel||'','Thanh toán':o.payment||'','Trạng thái':o.status,'CTKM':o.promoId? (promoMap().get(o.promoId)?.code||''):'','Tạm tính':o.subtotal||0,'Giảm CTKM':o.promoDiscount||0,'Chiết khấu thêm':Math.max(0,(o.discount||0)-(o.promoDiscount||0)),'Thành tiền':o.total||0,'Số SP':(o.items||[]).reduce((s,i)=>s+i.qty,0),'Số chứng từ':(o.docs||[]).length,'Ghi chú':o.note||''}));
    case 'lines': return ords.flatMap(o=>(o.items||[]).map(i=>({'Mã đơn':o.code,'Ngày':fmtDate(o.date),'Khách hàng':custName(o.customerId),'Trạng thái':o.status,'SKU':i.sku||'','Sản phẩm':i.name,'Số lượng':i.qty,'Đơn giá':i.price,'Thành tiền':i.qty*i.price})));
    case 'customers': { const y=S.ui.cust.y||'', sh=custSheet(y);
      return [...S.customers].sort((a,b)=>(sh.by.get(b.id)?.total||0)-(sh.by.get(a.id)?.total||0) || (a.code||'').localeCompare(b.code||'')).map(c=>{ const r=sh.by.get(c.id), s=cs.get(c.id)||{};
        const o={'Mã khách hàng':c.code||'','Tên khách hàng':c.name,'Phân loại':custType(c),'MST':c.taxCode||'','Địa chỉ':c.address||'','Tỉnh/thành':c.city||'','Khu vực':custArea(c)||'','Nhà phân phối':c.distributor||'','Sales phụ trách':c.salesRep||'','Người đại diện':c.representative||'','Điện thoại':c.phone||'','Email':c.email||'','Mã khách hàng':c.code||'','Trạng thái đăng ký':regStatus(c)};
        sh.months.forEach(m=>{ o['SL T'+monthMM(m)+' (tấm)']=r?.months[m]||0; }); o['Tổng sản lượng (tấm)']=r?.total||0; o['Doanh thu (₫)']=Math.round(r?.rev||0);
        sh.tours.forEach(p=>{ const e=progEntry(p,c.id); o[p.code+' ('+progKind(p)+') · SL (tấm)']=e?e.total:0; o[p.code+' · Kết quả']=progCell(p,c.id,true); });
        o['SL không thuộc CTKM (tấm)']=r?.out||0;
        if(S.orders.length){ o['Số đơn']=s.orders||0; o['Tổng chi tiêu']=Math.round(s.spent||0); }
        return o; }); }
    case 'promos': return [...S.promos].sort((a,b)=>a.start.localeCompare(b.start)).map(p=>{
      if(isFO(p)){ const f=foPerf(p); return {'Mã':p.code,'Tên':p.name,'Loại':'First order','Bắt đầu':fmtDate(p.start),'Kết thúc':fmtDate(p.end),'Trạng thái':promoStatus(p)[0],'Ngân sách':p.budget||'','% Ngân sách':f.budgetPct==null?'':+(f.budgetPct*100).toFixed(1),'Khách first order':f.customers,'Khách đã ghi nhận':f.countedCustomers,'Sản lượng first order (tấm)':f.volume,'Sản lượng ghi nhận (tấm)':f.counted,'Chi phí hỗ trợ':f.cost}; }
      if(isTour(p)){ const f=tourPerf(p); return {'Mã':p.code,'Tên':p.name,'Loại':'Tour promotion','Bắt đầu':fmtDate(p.start),'Kết thúc':fmtDate(p.end),'Trạng thái':promoStatus(p)[0],'Ngân sách':p.budget||'','% Ngân sách':f.budgetPct==null?'':+(f.budgetPct*100).toFixed(1),'Sản lượng ghi nhận (tấm)':f.counted,'Sản lượng chờ ghi nhận (tấm)':f.pending,'Mục tiêu sản lượng':p.targetVolume||'','% Mục tiêu SL':f.targetPct==null?'':+(f.targetPct*100).toFixed(1),'Cửa hàng tham gia':f.participants,'Cửa hàng đạt':f.qualified,'Số suất tour':f.slots,'Chi phí tour dự kiến':f.cost}; }
      const f=promoPerf(p); return {'Mã':p.code,'Tên':p.name,'Loại':'Giảm giá đơn hàng','Hình thức':p.type==='percent'? p.value+'%':p.value+' ₫','Bắt đầu':fmtDate(p.start),'Kết thúc':fmtDate(p.end),'Trạng thái':promoStatus(p)[0],'Số đơn':f.orders,'Doanh thu':Math.round(f.revenue),'Chi phí KM':Math.round(f.cost),'Ngân sách':p.budget||'','% Ngân sách':f.budgetPct==null?'':+(f.budgetPct*100).toFixed(1),'Mục tiêu DT':p.targetRevenue||'','% Mục tiêu DT':f.targetPct==null?'':+(f.targetPct*100).toFixed(1),'DT/1đ KM':f.cost?+(f.revenue/f.cost).toFixed(2):'','Tăng trưởng DT/ngày %':f.uplift==null?'':+(f.uplift*100).toFixed(1),'Khách mới':f.newCust,'Số KH dùng mã':f.custs};});
    case 'documents': return [...S.uploads].filter(x=>!x.at||(x.at.slice(0,10)>=R[0]&&x.at.slice(0,10)<=R[1])).sort((a,b)=>(new Date(b.at||0))-(new Date(a.at||0))).map(x=>({'Thời gian':fmtDT(x.at),'Loại':UP_TYPES[x.type]||x.type,'Tên file':x.fileName,'Nội dung':x.summary||'','Nhà phân phối':x.npp?nppShort(x.npp):'','Tháng':x.month?monthMM(x.month):'','Có lưu file gốc':x.assetId?'Có':'Không'}));
    case 'vouchers': return voucherRows([...S.vouchers].sort((a,b)=>(a.date||'').localeCompare(b.date||'')));
    case 'registrations': { const cv=custVolume(); return [...S.customers].filter(c=>regStatus(c)!=='Chưa đăng ký'||cv.get(c.id)).sort((a,b)=>(a.code||'').localeCompare(b.code||'')).map(c=>({'Mã KH':c.code,'Tên công ty / Cửa hàng / Xưởng':c.name,'Người đại diện':c.representative||'','Chức vụ':c.position||'','Điện thoại':c.phone||'','Email':c.email||'','Địa chỉ kinh doanh':c.address||'','Tỉnh / Thành phố':c.city||'','Khu vực':c.area||'','Loại hình kinh doanh':(c.businessTypes||[]).map(t=>t==='Khác'&&c.otherType?c.otherType:t).join(', '),'SL dự kiến / tháng (tấm)':c.expectedVolume||'','NPP phụ trách':c.distributor||'','Sales phụ trách':c.salesRep||'','CTKM tour':c.tourId?(promoMap().get(c.tourId)?.code||''):'','PNP Customer Code':c.code||'','Ngày đăng ký':fmtDate(c.regDate),'Ngày duyệt':fmtDate(c.codeDate),'Trạng thái':regStatus(c),'SL thực nhận (tấm)':cv.get(c.id)||0})); }
    case 'allocations': { const m0=R[0].slice(0,7), m1=R[1].slice(0,7); const al=allocs || S.allocations.filter(a=>a.month>=m0&&a.month<=m1);
      return [...al].sort((a,b)=>(a.month||'').localeCompare(b.month||'')).flatMap(a=>(a.rows||[]).map((r,i)=>{ const c=allocCust(r); return {'Tháng':monthMM(a.month),'Tỉnh':a.province||'','Nhà phân phối':a.distributor||'','Sản phẩm':a.product||'','STT':i+1,'Mã code khách hàng':c?.code||'','Tên cửa hàng':r.storeName,'Khu vực':r.area||'','Thực nhận (tấm)':+r.qty||0,'Đơn giá / tấm':priceFor(a)??'','Doanh thu':priceFor(a)==null?'':Math.round((+r.qty||0)*priceFor(a)),'CTKM':(()=>{ const x=afIdx().get(a.id+'|'+i), pp=x&&promoMap().get(x.promoId); return pp? pp.code+' ('+progKind(pp)+')' : ''; })(),'Ghi nhận CTKM':hasCode(c)?'Có':'Chưa có code','Ghi chú':r.note||''}; })); }
  }
  return [];
}
VIEWS.export = {
  shell: () => `
  <div class="page-head"><div><h1>Xuất dữ liệu</h1><p>Tải dữ liệu về dạng Excel, CSV hoặc JSON để lưu trữ, đối soát kế toán hoặc phân tích thêm.</p></div>
    <div class="actions"><button class="btn primary" id="eAll">${icon('down')} Xuất toàn bộ (Excel nhiều sheet)</button></div></div>
  <div class="grid g-2">
    <section class="panel panel-b grid">
      <div class="field"><span>Bộ dữ liệu</span><div class="grid" id="eDs" style="gap:8px"></div></div>
      <div class="cfg" id="ePer"></div>
      <label class="field" style="max-width:240px"><span>Định dạng</span><select id="eFmt"><option value="xlsx">Excel (.xlsx)</option><option value="csv">CSV (.csv)</option><option value="json">JSON (.json)</option></select></label>
      <div class="actions"><button class="btn primary" id="eGo">${icon('down')} Xuất file</button><span class="muted small" id="eCount"></span></div>
      <p class="muted small" style="margin:0" id="eNote"></p>
    </section>
    <section class="panel"><div class="panel-h"><h2>Xem trước</h2><span class="muted small">8 dòng đầu</span></div><div class="tbl-wrap" id="ePrev" style="margin-top:10px"></div></section>
  </div>`,
  bind(){
    const u=S.ui.exp;
    $('#eFmt').value=u.fmt; $('#eFmt').onchange=e=>u.fmt=e.target.value;
    $('#eGo').onclick=()=>exportData(u.ds,u.fmt);
    $('#eAll').onclick=()=>offerXlsx('crm_toan-bo_'+today(), Object.keys(DATASETS).map(k=>({name:DATASETS[k].label, rows:datasetRows(k)})));
  },
  update(){
    const u=S.ui.exp;
    $('#eDs').innerHTML = Object.entries(DATASETS).map(([k,d])=>`<label class="panel" style="display:flex;gap:10px;padding:10px 12px;cursor:pointer;${u.ds===k?'border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)':''}"><input type="radio" name="eds" value="${k}" ${u.ds===k?'checked':''}><span><b>${d.label}</b><br><span class="muted small">${d.desc}</span></span></label>`).join('');
    $$('#eDs input').forEach(i=>i.onchange=()=>{u.ds=i.value; update();});
    $('#ePer').innerHTML = DATASETS[u.ds].period? periodControl('ep',u) : '';
    if(DATASETS[u.ds].period) bindPeriod('ep',u,()=>update());
    if(loading(['customers','promos','allocations','vouchers'])){ $('#ePrev').innerHTML='<div class="empty">Đang tải…</div>'; return; }
    const rows=datasetRows(u.ds);
    $('#eCount').textContent=num(rows.length)+' dòng sẽ được xuất';
    $('#eNote').textContent = S.downloads? '' : 'Tải file chưa khả dụng trong chế độ xem này. Hãy mở trang trong Claude khi đã đăng nhập.';
    const cols=allKeys(rows);
    $('#ePrev').innerHTML = rows.length? `<table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.slice(0,8).map(r=>`<tr>${cols.map(c=>`<td class="${typeof r[c]==='number'?'num':''}" style="white-space:nowrap">${typeof r[c]==='number'? num(r[c]) : esc(r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table>` : '<div class="empty">Không có dữ liệu trong phạm vi đã chọn.</div>';
  }
};
const fileName = s => norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') + '_' + today();
const allKeys = rows => { const k=[]; const seen=new Set(); rows.forEach(r=>Object.keys(r).forEach(x=>{ if(!seen.has(x)){ seen.add(x); k.push(x);} })); return k; };
function toCSV(rows){ if(!rows.length) return '﻿'; const cols=allKeys(rows); const q=v=>{ const s=String(v??''); return /[",\n;]/.test(s)? '"'+s.replace(/"/g,'""')+'"' : s; };
  return '﻿'+[cols.map(q).join(','), ...rows.map(r=>cols.map(c=>q(r[c])).join(','))].join('\r\n'); }
async function offerFile(name, data){
  if(!S.downloads) return toast('Không thể tải file trong chế độ xem này.','bad');
  try{ const r=await S.downloads.save({filename:name, data}); if(r.status==='saved') toast('Đã xuất '+name); }
  catch(e){ const c=e&&e.code; if(c==='declined') return; toast(c==='rate_limited'?'Đang có một hộp thoại tải file mở. Hãy hoàn tất trước.':'Không xuất được file ('+(c||'lỗi')+').','bad'); }
}
function offerXlsx(base, sheets){
  if(!window.XLSX) return toast('Không tải được thư viện Excel. Hãy dùng CSV.','bad');
  const wb=XLSX.utils.book_new();
  sheets.forEach(s=>{ const ws=XLSX.utils.json_to_sheet(s.rows.length? s.rows : [{'Không có dữ liệu':''}]); const cols=allKeys(s.rows);
    ws['!cols']=cols.map(c=>({wch:Math.min(40,Math.max(c.length, ...s.rows.slice(0,200).map(r=>String(r[c]??'').length))+2)}));
    XLSX.utils.book_append_sheet(wb, ws, s.name.slice(0,31)); });
  const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  offerFile(base+'.xlsx', new Uint8Array(buf));
}
function exportData(ds, fmt, orders, allocs){
  const rows=datasetRows(ds, orders, allocs), base=fileName(DATASETS[ds].label);
  if(fmt==='csv') return offerFile(base+'.csv', toCSV(rows));
  if(fmt==='json') return offerFile(base+'.json', JSON.stringify(rows,null,2));
  offerXlsx(base, [{name:DATASETS[ds].label, rows}]);
}

/* ---------- overlay: modal / drawer / confirm ---------- */
let overlayState=null;
function wireOverlay(){
  const ov=$('#overlay');
  ov.addEventListener('mousedown', e=>{ if(e.target===ov) closeOverlay(); });
  ov.addEventListener('click', e=>{ if(e.target.closest('[data-close]')) closeOverlay(); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !ov.hidden) closeOverlay(); });
}
function openModal({title, body, foot, mount, wide, onClose}){
  closeOverlay();
  const ov=$('#overlay'); ov.className='overlay'; ov.hidden=false;
  ov.innerHTML=`<div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><h2>${esc(title)}</h2><button class="icon-btn" data-close aria-label="Đóng">${icon('x')}</button></header><div class="m-body">${body}</div>${foot?`<footer>${foot}</footer>`:''}</div>`;
  overlayState={onClose}; mount && mount();
}
function openDrawer({title, body, mount}){
  closeOverlay();
  const ov=$('#overlay'); ov.className='overlay drawer-ov'; ov.hidden=false;
  ov.innerHTML=`<div class="drawer" role="dialog" aria-modal="true"><header><h2>${title}</h2><button class="icon-btn" data-close aria-label="Đóng">${icon('x')}</button></header><div class="d-body">${body}</div></div>`;
  overlayState={}; mount && mount();
}
function closeOverlay(saved){ const ov=$('#overlay'); if(ov.hidden) return; const st=overlayState; overlayState=null; ov.hidden=true; ov.innerHTML=''; if(st&&st.onClose) st.onClose(saved===true); }
function confirmBox(title, msg, okLabel, fn){
  openModal({title, body:`<p style="margin:0">${esc(msg)}</p>`, foot:`<button class="btn" data-close>Hủy</button><button class="btn primary" id="cfOk" style="background:var(--bad);border-color:var(--bad);color:#fff">${esc(okLabel)}</button>`,
    mount(){ $('#cfOk').onclick=async()=>{ $('#cfOk').disabled=true; await fn(); closeOverlay(); }; }});
}

delete VIEWS.orders; delete VIEWS.reports;   // not used in this CRM
init();
})();
