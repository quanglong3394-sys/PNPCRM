<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lexend:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: dark ledger-spine sidebar + cool jade-tinted work surface; red "con dấu" seal reserved for documents */
:root{
  --bg:#eceeef; --surface:#ffffff; --surface-2:#f4f5f6; --ink:#1a1f23; --muted:#5d666d; --line:#d5d9dc; --line-2:#e5e8ea;
  --accent:#2f3d46; --accent-ink:#ffffff; --accent-soft:#e1e6e9;
  --side:#1a2024; --side-fg:#c3cacf; --side-hi:#ffffff; --side-act:#2a3339;
  --seal:#9c4a1f; --seal-soft:#f3e4da;
  --good:#4b6630; --warn:#a8711c; --bad:#9c4a1f; --info:#5b6a2c; --violet:#3e4c57;
  --c1:#2f3d46; --c2:#5b6a2c; --c3:#b0782a; --c4:#4a5b68; --c5:#8c7b58; --c6:#7b858c;
  --shadow:0 1px 2px rgba(20,26,30,.06),0 6px 24px rgba(20,26,30,.06);
  --f-display:"Lexend","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101315; --surface:#181c1f; --surface-2:#1e2326; --ink:#e4e7e9; --muted:#9aa3a9; --line:#2f363b; --line-2:#262c30;
  --accent:#c99a55; --accent-ink:#1a1408; --accent-soft:#3a2f1e;
  --side:#0b0e10; --side-fg:#adb5ba; --side-hi:#ffffff; --side-act:#1f2529;
  --seal:#d98a5c; --seal-soft:#3a2418;
  --good:#9bb46a; --warn:#e0a84c; --bad:#d98a5c; --info:#a8b86a; --violet:#9fb1bd;
  --c1:#c99a55; --c2:#a8b86a; --c3:#e0a84c; --c4:#8fa4b2; --c5:#c6b48c; --c6:#a5afb5;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101315; --surface:#181c1f; --surface-2:#1e2326; --ink:#e4e7e9; --muted:#9aa3a9; --line:#2f363b; --line-2:#262c30;
  --accent:#c99a55; --accent-ink:#1a1408; --accent-soft:#3a2f1e;
  --side:#0b0e10; --side-fg:#adb5ba; --side-hi:#ffffff; --side-act:#1f2529;
  --seal:#d98a5c; --seal-soft:#3a2418;
  --good:#9bb46a; --warn:#e0a84c; --bad:#d98a5c; --info:#a8b86a; --violet:#9fb1bd;
  --c1:#c99a55; --c2:#a8b86a; --c3:#e0a84c; --c4:#8fa4b2; --c5:#c6b48c; --c6:#a5afb5;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.6rem} h2{font-size:1.1rem} h3{font-size:.95rem}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.num{white-space:nowrap}
.mono{font-family:var(--f-mono);font-size:.82em;letter-spacing:.01em}
.muted{color:var(--muted)}
.small{font-size:.82rem}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-fg);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:20px;padding:22px 14px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;color:var(--side-hi);text-decoration:none;border-radius:8px}
.brand:hover b{text-decoration:underline}
.lang-sw{display:inline-flex;align-self:flex-start;margin:0 8px;border:1px solid var(--side-act);border-radius:6px;overflow:hidden}
.lang-sw button{font:600 .74rem var(--f-body);letter-spacing:.04em;padding:4px 10px;background:transparent;color:var(--side-fg);border:0;cursor:pointer}
.lang-sw button[aria-pressed="true"]{background:var(--side-act);color:var(--side-hi)}
.brand-logo{width:38px;height:38px;border-radius:4px;flex:none;display:block}
.seal-mark{width:34px;height:34px;border:2px solid var(--seal);border-radius:6px;display:grid;place-items:center;color:var(--seal);font-family:var(--f-display);font-weight:700;font-size:11px;letter-spacing:.04em;transform:rotate(-6deg);background:color-mix(in srgb,var(--seal) 10%,transparent)}
.brand b{font-family:var(--f-display);font-size:1.02rem;font-weight:600;line-height:1.1}
.brand small{display:block;color:var(--side-fg);font-size:.72rem;font-weight:400}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;color:var(--side-fg);text-decoration:none;font-weight:500;white-space:nowrap}
.nav a svg{width:18px;height:18px;flex:none;opacity:.8}
.nav a:hover{background:var(--side-act);color:var(--side-hi)}
.nav a[aria-current="page"]{background:var(--side-act);color:var(--side-hi);box-shadow:inset 3px 0 0 var(--accent)}
.side-foot{margin-top:auto;font-size:.75rem;padding:0 8px;line-height:1.45}
.side-foot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-right:6px}
.side-foot .dot.ok{background:var(--good)}

main{min-width:0;padding-block:26px 60px;padding-inline:clamp(16px,3vw,36px)}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:20px}
.page-head p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:4px 9px;font-size:.82rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{border:0;background:transparent;cursor:pointer;padding:6px;border-radius:6px;color:var(--muted);display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:18px;height:18px}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:.74rem;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.05em}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=email],input[type=tel],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;max-width:100%}
textarea{resize:vertical;min-height:64px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.search{position:relative;flex:1 1 220px;max-width:340px}
.search input{width:100%;padding-left:32px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
.check{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 0}
.panel-b{padding:14px 16px 16px}
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.g-2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1100px){.g-2,.g-2e{grid-template-columns:minmax(0,1fr)}}

.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .lbl{font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:500}
.kpi .val{font-family:var(--f-display);font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .delta{font-size:.78rem;font-variant-numeric:tabular-nums}
.up{color:var(--good)} .down{color:var(--bad)}

.chart-box{position:relative;height:280px}
.chart-box.sm{height:220px}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
tfoot td{font-weight:600;border-top:1px solid var(--line);border-bottom:0;background:var(--surface-2)}
.tbl-foot{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;color:var(--muted);font-size:.82rem;gap:10px;flex-wrap:wrap}
.cell-main{font-weight:500}
.cell-sub{font-size:.78rem;color:var(--muted)}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;background:color-mix(in srgb,var(--chip,var(--muted)) 14%,transparent);color:var(--chip,var(--muted))}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.plain::before{display:none}
.st-new{--chip:var(--info)} .st-proc{--chip:var(--warn)} .st-ship{--chip:var(--violet)} .st-done{--chip:var(--good)} .st-cancel{--chip:var(--bad)}
.seg-VIP{--chip:var(--c3)} .seg-TT{--chip:var(--accent)} .seg-new{--chip:var(--info)} .seg-dl{--chip:var(--violet)}
.stamp{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;color:var(--seal);border:1.5px solid var(--seal);border-radius:4px;padding:0 6px;letter-spacing:.03em;transform:rotate(-3deg)}
.stamp.none{color:var(--muted);border-color:var(--line);border-style:dashed;transform:none;font-weight:500}

.bar-list{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(90px,130px) 1fr auto;gap:10px;align-items:center;font-size:.85rem}
.bar-track{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:var(--fill,var(--accent))}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;min-width:70px}
.progress>i{display:block;height:100%;background:var(--fill,var(--accent));border-radius:99px}

.banner{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:11px 14px;border-radius:var(--r);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);margin-bottom:16px;font-size:.88rem}
.banner.warn{background:color-mix(in srgb,var(--warn) 12%,var(--surface));border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-weight:600;margin-bottom:4px}

/* reports */
.rep-layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.rep-layout{grid-template-columns:minmax(0,1fr)}}
.tpl-list{display:flex;flex-direction:column;padding:6px}
.tpl{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 10px;border-radius:7px;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.tpl:hover{background:var(--surface-2)}
.tpl.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tpl-sec{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:10px 10px 4px;font-weight:600}
.cfg{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end}
.metric-pick{display:flex;flex-wrap:wrap;gap:6px}
.metric-pick label{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:.82rem}
.metric-pick label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.metric-pick input{position:absolute;opacity:0;pointer-events:none}

/* promo cards */
.promo-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.pcard{padding:14px 16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.pcard:hover{border-color:var(--muted)}
.pcard.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pcard-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pstats div{display:flex;flex-direction:column}
.pstats b{font-variant-numeric:tabular-nums;font-size:.95rem}
.pstats span{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.prog-row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:.76rem;color:var(--muted)}

/* overlay: modal + drawer */
.overlay{position:fixed;inset:0;background:rgba(10,16,14,.45);z-index:50;display:flex;justify-content:center;align-items:flex-start;padding:max(4vh,env(safe-area-inset-top,0px)) 16px 16px;overflow-y:auto}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:640px;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column;margin-bottom:4vh}
.modal.wide{max-width:920px}
.modal>header,.drawer>header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.m-body{padding:18px;display:flex;flex-direction:column;gap:14px}
.modal>footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.form-grid .full{grid-column:1/-1}
@media (max-width:560px){.form-grid{grid-template-columns:minmax(0,1fr)}}
.drawer-ov{justify-content:flex-end;padding:0;align-items:stretch}
.drawer{background:var(--surface);width:min(560px,100%);height:100%;overflow-y:auto;border-left:1px solid var(--line);display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer .d-body{padding:18px;display:flex;flex-direction:column;gap:18px}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:7px 12px;font-size:.88rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.mini-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini-kpis div{background:var(--surface-2);border-radius:8px;padding:10px 12px}
.mini-kpis b{display:block;font-family:var(--f-display);font-size:1.05rem;font-variant-numeric:tabular-nums}
.mini-kpis span{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.mini-kpis b+span{text-transform:none;letter-spacing:0;font-size:.74rem}

.items-tbl td{padding:6px 6px} .items-tbl th{padding:7px 6px}
.items-tbl input{width:100%}
.ptabs{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap}
.ptabs button{flex:1 1 160px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);cursor:pointer;text-align:left;font:inherit}
.ptabs button b{font-family:var(--f-display);font-size:1.02rem}
.ptabs button span{font-size:.78rem;color:var(--muted)}
.ptabs button[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent);background:var(--accent-soft)}
.qlik{border:1px solid #9aa3a8;border-radius:2px;background:var(--surface)}
.qlik-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 8px;background:linear-gradient(#f4f5f6,#dfe3e6);border-bottom:1px solid #9aa3a8;font-weight:700;font-size:.86rem;color:#1d2328}
.qlik-h .qbtn{font:600 .72rem var(--f-mono);border:1px solid #9aa3a8;background:#fff;color:#1d2328;border-radius:2px;padding:1px 6px;cursor:pointer}
:root[data-theme="dark"] .qlik-h{background:linear-gradient(#2a3136,#20262a);color:var(--ink);border-color:var(--line)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .qlik-h{background:linear-gradient(#2a3136,#20262a);color:var(--ink);border-color:var(--line)}}
.qlik-b{height:430px;padding:8px 6px 4px}
.so-tbl input,.so-tbl select{font-size:.82rem;padding:5px 6px;min-height:0} .so-tbl td{padding:4px 3px}
.totals{display:grid;grid-template-columns:1fr auto;gap:5px 18px;justify-content:end;margin-left:auto;min-width:min(320px,100%);font-variant-numeric:tabular-nums}
.totals .grand{font-family:var(--f-display);font-size:1.15rem;font-weight:600;padding-top:6px;border-top:1px solid var(--line)}
.note{font-size:.8rem;padding:7px 10px;border-radius:7px;background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--warn)}
.note.ok{background:var(--accent-soft);color:var(--accent)}

.doc-list{display:flex;flex-direction:column;gap:6px}
.doc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.doc .ico{width:32px;height:38px;border:1.5px solid var(--seal);border-radius:3px;display:grid;place-items:center;font-size:.6rem;font-weight:700;color:var(--seal);font-family:var(--f-mono)}
.doc .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uploader{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border:1.5px dashed var(--line);border-radius:8px}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:500;z-index:80;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
#toast.bad{background:var(--bad);color:#fff}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:30;flex-direction:row;align-items:center;gap:10px;padding:10px 12px}
  .brand small,.side-foot{display:none}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none}
  .nav a{padding:7px 10px}
  .nav a span{display:none}
  .nav a[aria-current="page"] span{display:inline}
  .nav a[aria-current="page"]{box-shadow:inset 0 -2px 0 var(--accent)}
  .kv{grid-template-columns:100px minmax(0,1fr)}
}
/* PNP registration form editor */
.sec-h{background:var(--side);color:var(--side-hi);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;padding:8px 12px}
.sec-h small{text-transform:none;font-weight:400;opacity:.7;letter-spacing:0;font-size:.78rem}
.rf{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.rf-row{display:grid;grid-template-columns:minmax(150px,34%) minmax(0,1fr);border-top:1px solid var(--line-2)}
.sec-h+.rf-row{border-top:0}
.rf-l{background:var(--surface-2);padding:8px 12px;font-weight:500;font-size:.86rem;display:flex;align-items:center}
.rf-v{padding:6px 10px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;min-width:0}
.rf-v>input,.rf-v>select{flex:1 1 200px}
.rf-sign{display:flex;flex-wrap:wrap;gap:10px 28px;padding:12px}
.rf-docs{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}
@media (max-width:560px){.rf-row{grid-template-columns:minmax(0,1fr)}}
.paper-wrap{overflow-x:auto;background:var(--surface-2);border-radius:8px;padding:12px}
.tier-list{display:flex;flex-direction:column;gap:8px}
.tier{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.tier .progress{grid-column:1/-1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 12px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.spark{display:block}
tr.grp th{text-align:center;background:var(--accent-soft);color:var(--accent);font-size:.72rem}
th.gs,td.gs{border-left:2px solid var(--line)}
tfoot td.gs{border-left:2px solid var(--line)}
body.ro [data-w]{display:none!important}
body.noadmin [data-admin]{display:none!important}
[hidden]{display:none!important}
body{margin:0}
@media (prefers-reduced-motion:no-preference){.overlay{animation:fade .15s ease}.drawer{animation:slide .2s ease}}
@keyframes fade{from{opacity:.4}}
@keyframes slide{from{transform:translateX(30px)}}

function presetRange(p, from, to){
  const t = today(), y = t.slice(0,4), m = +t.slice(5,7);
  switch(p){
    case 'last7': return [addDays(t,-6), t];
    case 'last30': return [addDays(t,-29), t];
    case 'last90': return [addDays(t,-89), t];
    case 'thisMonth': return [t.slice(0,8)+'01', t];
    case 'lastMonth': { const f = m===1 ? (+y-1)+'-12-01' : y+'-'+pad(m-1)+'-01'; return [f, addDays(t.slice(0,8)+'01',-1)]; }
    case 'thisQuarter': return [y+'-'+pad(Math.floor((m-1)/3)*3+1)+'-01', t];
    case 'thisYear': return [y+'-01-01', t];

  }
}

const METRICS = {
  revenue:{label:'Doanh thu thuần', money:true}, gross:{label:'Doanh thu gộp', money:true}, discount:{label:'Chiết khấu', money:true},
  orders:{label:'Số đơn'}, aov:{label:'Giá trị đơn TB', money:true}, qty:{label:'Số lượng SP'}, customers:{label:'Số khách hàng'}, share:{label:'Tỷ trọng doanh thu', pct:true}

function aggregate(orders, dimKey){
  const dim = DIMS[dimKey], m = new Map();
  const row = (k) => { let r=m.get(k); if(!r){ r={key:k, revenue:0, gross:0, discount:0, orders:0, qty:0, cust:new Set()}; m.set(k,r);} return r; };
  for(const o of orders){
    const items=o.items||[];
    if(dim.product){
      const sub = o.subtotal || items.reduce((s,i)=>s+i.qty*i.price,0) || 1;
      const seen = new Set();
      for(const it of items){ const r=row(it.name||'(không tên)'); const g=(it.qty||0)*(it.price||0);
        r.gross+=g; r.revenue+=g*(o.total||0)/sub; r.discount+=g*(o.discount||0)/sub; r.qty+=it.qty||0;
        if(!seen.has(r.key)){ r.orders++; seen.add(r.key);} r.cust.add(o.customerId); }
    } else {
      const r=row(dim.key(o)); r.revenue+=o.total||0; r.gross+=o.subtotal||0; r.discount+=o.discount||0; r.orders++; r.qty+=items.reduce((s,i)=>s+(i.qty||0),0); r.cust.add(o.customerId);
    }
  }
  const total = [...m.values()].reduce((s,r)=>s+r.revenue,0);
  const rows = [...m.values()].map(r=>({key:r.key, label:(dim.fmt||(k=>k))(r.key), revenue:r.revenue, gross:r.gross, discount:r.discount, orders:r.orders, qty:r.qty, customers:r.cust.size, aov:r.orders? r.revenue/r.orders:0, share: total? r.revenue/total:0}));
  rows.sort(dim.time ? (a,b)=>a.key.localeCompare(b.key) : (a,b)=>b.revenue-a.revenue);
  const allCust = new Set(orders.map(o=>o.customerId));
  const tot = rows.reduce((t,r)=>{ t.revenue+=r.revenue; t.gross+=r.gross; t.discount+=r.discount; t.qty+=r.qty; return t; }, {revenue:0,gross:0,discount:0,qty:0});
  tot.orders = orders.length; tot.customers = allCust.size; tot.aov = tot.orders? tot.revenue/tot.orders : 0; tot.share = total?1:0;
  return {rows, tot};
}

function tourMatch(p, x){ const m0=(p.start||'').slice(0,7), m1=(p.end||'').slice(0,7); if(x.month<m0||x.month>m1) return false;
  const pr=(p.products||[]).map(v=>norm(v).trim()).filter(Boolean), np=(p.distributors||[]).map(v=>norm(v).trim()).filter(Boolean);
  return (!pr.length||pr.includes(norm(x.product).trim())) && (!np.length||np.includes(norm(x.npp).trim())); }
const toursOf = x => S.promos.filter(p=>isTour(p) && tourMatch(p,x));

function custSheet(y){ return cached('csh-'+y, ()=>{
  const fl=allocFlat().filter(x=>x.c && (!y || x.month.startsWith(y)));
  const months=[...new Set(fl.map(x=>x.month))].sort();
  const tours=S.promos.filter(isVolProg).filter(p=>!y || (p.start.slice(0,4)<=y && p.end.slice(0,4)>=y)).sort((a,b)=>(isFO(b)-isFO(a)) || a.start.localeCompare(b.start));
  const by=new Map();
  for(const x of fl){ let r=by.get(x.c.id); if(!r){ r={months:{}, total:0, rev:0, out:0}; by.set(x.c.id,r); }
    r.months[x.month]=(r.months[x.month]||0)+x.qty; r.total+=x.qty; r.rev+=x.rev; if(!x.promoId) r.out+=x.qty; }
  return {months, tours, by};
}); }
function tourCell(p, cid, plain){

const PROVINCES = [[/ho chi minh|\bhcm\b|tp\.?\s*hcm|sai gon/, 'TP.HCM'], [/dong nai/, 'Đồng Nai'], [/binh duong/, 'Bình Dương'], [/binh phuoc/, 'Bình Phước'], [/ba ria|vung tau/, 'Bà Rịa - Vũng Tàu'],
  [/long an/, 'Long An'], [/tay ninh/, 'Tây Ninh'], [/ha noi/, 'Hà Nội'], [/da nang/, 'Đà Nẵng'], [/can tho/, 'Cần Thơ'], [/kien giang/, 'Kiên Giang'], [/an giang/, 'An Giang'], [/lam dong|da lat/, 'Lâm Đồng'],
  [/khanh hoa|nha trang/, 'Khánh Hòa'], [/tien giang/, 'Tiền Giang'], [/ben tre/, 'Bến Tre'], [/vinh long/, 'Vĩnh Long'], [/dong thap/, 'Đồng Tháp'], [/hai phong/, 'Hải Phòng'], [/phu quoc/, 'Phú Quốc']];
const DISTRICT_ONLY = /^(bien hoa|vinh cuu|thu duc|di an|thu dau mot)$/;
const provinceOf = s => { const n=norm(s); const p=PROVINCES.find(([rx])=>rx.test(n)); return p? p[1] : ''; };
const titleVi = s => s===s.toUpperCase() && /[A-ZÀ-Ỹ]/.test(s) ? s.toLocaleLowerCase('vi').replace(/(^|\s)(\S)/g,(m,a,b)=>a+b.toLocaleUpperCase('vi')) : s;
function areaFromAddress(address, city){
  const addr=String(address||'').replace(/\([^)]*\)/g,' ');
  const prov=[...addr.split(/,|\s+-\s+/)].reverse().map(provinceOf).find(Boolean) || (/bien hoa|trang bom|ho nai|vinh cuu|long thanh/.test(norm(addr))? 'Đồng Nai' : /thu duc/.test(norm(addr))? 'TP.HCM' : '') || provinceOf(city) || String(city||'').trim();
  let parts=addr.split(/,|\s+-\s+/).map(s=>s.replace(/\s+/g,' ').trim()).filter(Boolean);
  let ward='', district='';
  const locs=[];
  for(let p of parts){ const n=norm(p).trim();
    if(/^viet ?nam$/.test(n) || provinceOf(p) && /^(tp\.?|thanh pho|tinh)?\s*(ho chi minh|hcm|tp\.?\s*hcm|dong nai|binh duong|binh phuoc|long an|tay ninh|ha noi|da nang|can tho|kien giang|an giang|lam dong|khanh hoa|ba ria.*|vung tau)$/.test(n.replace(/\./g,'. ').replace(/\s+/g,' ').trim())) continue;
    const m=n.match(/^(p\.|phuong |xa |x\.|thi tran |tt\.? ?|dac khu )\s*/);
    if(m && p.slice(m[0].length).trim()){ ward=ward||p.slice(m[0].length).trim(); continue; }
    if(/^(quan|q\.|q\d|huyen|h\.|thanh pho|tp\.?|thi xa|tx\.?)\b/.test(n) || /^q\.?\s*\d/.test(n)){ district=district||p.replace(/^(quận|quan|q\.|huyện|huyen|h\.|thành phố|thanh pho|tp\.?|thị xã|thi xa|tx\.?)\s*/i,'').trim(); continue; }
    if(/^\d|^(so|duong|d\.|kp\.?|khu pho|khu |to |to$|hem|ngo|lo |kcn|du an|giao xu|ql|quoc lo|ap |thon)/.test(n) || /\d{2,}/.test(n)) continue;
    let q=p.replace(/\s+(biên hòa|biên hoà|bien hoa)$/i,'').trim();
    if(DISTRICT_ONLY.test(norm(q).trim())){ district=district||q; continue; }
    locs.push(q); }
  ward = ward || locs[locs.length-1] || '';
  const w=titleVi(ward||'');
  const pv=PROVINCES.some(([,v])=>v===prov)? prov : titleVi(prov||'');
  if(w && pv && norm(w).trim()!==norm(pv).trim()) return w+' - '+pv;
  return w || pv || titleVi(district||''); }

VIEWS.registrations = {
  shell: () => `
  <div class="page-head"><div><h1>Đăng ký PNP Customer Code</h1><p>PNP Customer Code chính là mã khách hàng (PROMOTION…). Khách nộp phiếu đăng ký, bạn bấm <b>Duyệt</b> là sản lượng của khách được ghi nhận vào CTKM.</p></div>
    <div class="actions"><button class="btn" id="rgExp">${icon('down')} Xuất Excel</button><button class="btn" data-w id="rgImp">${icon('up')} Nhập phiếu từ file PDF/Excel</button><button class="btn" data-w id="rgAll">✓ Duyệt hàng loạt khách có code</button><button class="btn primary" data-w id="rgAdd">${icon('plus')} Phiếu đăng ký mới</button></div></div>
  <div class="grid g-kpi" id="rgKpi" style="margin-bottom:14px"></div>
  <div class="toolbar">
    <div class="search">${icon('search')}<input type="search" id="rgQ" placeholder="Tên, người đại diện, SĐT, mã PNP" value="${esc(S.ui.reg.q)}"></div>
    <select id="rgSt" aria-label="Trạng thái"><option value="">Mọi trạng thái</option>${REG_ST.map(s=>`<option ${S.ui.reg.st===s?'selected':''}>${s}</option>`).join('')}</select>

  bind(){ const u=S.ui.reg;
    $('#rgQ').addEventListener('input',e=>{u.q=e.target.value; update();});
    $('#rgSt').addEventListener('change',e=>{u.st=e.target.value; update();});
    $('#rgNpp').addEventListener('change',e=>{u.npp=e.target.value; update();});

  update(){

    const unc=S.customers.filter(c=>!hasCode(c)&&vol.get(c.id));
    const pendVol=unc.reduce((s,c)=>s+vol.get(c.id),0);
    $('#rgKpi').innerHTML=[
      ['Chờ duyệt', num(cnt('Chờ duyệt')), 'phiếu cần duyệt'],
      ['Đã duyệt', num(cnt('Đã duyệt')), 'khách được ghi nhận sản lượng'],
      ['Có sản lượng, chưa có code', num(unc.length)+' khách', num(pendVol)+' tấm chưa được ghi nhận']
    ].map(([l,v,s])=>`<div class="panel kpi"><span class="lbl">${l}</span><span class="val">${v}</span><span class="delta muted">${s}</span></div>`).join('');
    if(!S.customers.length){ $('#rgTbl').innerHTML='<div class="empty"><b>Chưa có phiếu đăng ký</b>Bấm “Phiếu đăng ký mới” để nhập phiếu PNP Customer Code đầu tiên.</div>'; $('#rgFoot').innerHTML=''; return; }
    const order={'Chờ duyệt':0,'Chưa đăng ký':1,'Đã duyệt':2,'Từ chối':3};

/* Duyệt hàng loạt: các khách đã được cấp mã khách hàng (PROMOTION…) nhưng chưa duyệt */
function bulkApproveForm(){
  if(!S.canWrite) return toast('Bạn chỉ có quyền xem.','bad');
  const cand=S.customers.filter(c=>c.code && regStatus(c)!=='Đã duyệt');
  if(!cand.length) return toast('Không còn khách có code nào chưa duyệt.');
  const cv=custVolume(), st={q:'', npp:'', reg:'', vol:false}, sel=new Set(cand.map(c=>c.id));
  const npps=[...new Set(cand.map(c=>c.distributor||''))];
  openModal({wide:true, title:'Duyệt hàng loạt khách đã có mã', body:`
    <p class="muted small" style="margin:0">Danh sách gồm các khách đã có mã khách hàng (PROMOTION…) nhưng chưa ở trạng thái <b>Đã duyệt</b>. Duyệt xong, sản lượng của khách được ghi nhận vào CTKM. Mặc định chọn tất cả, bỏ chọn khách nào chưa muốn duyệt.</p>
    <div class="toolbar" style="margin:0">
      <div class="search">${icon('search')}<input type="search" id="ba-q" placeholder="Tên, mã khách hàng"></div>
      <select id="ba-npp" aria-label="Kênh / NPP"><option value="">Mọi kênh / NPP</option>${npps.map(n=>`<option value="${esc(n)}">${esc(n? nppShort(n) : '(chưa có NPP)')}</option>`).join('')}</select>
      <select id="ba-reg" aria-label="Trạng thái"><option value="">Mọi trạng thái</option><option>Chờ duyệt</option><option>Chưa đăng ký</option><option>Từ chối</option></select>
      <label class="check"><input type="checkbox" id="ba-vol"> Chỉ khách có sản lượng</label>
    </div>
    <div class="tbl-wrap" style="max-height:52vh;overflow:auto"><table><thead><tr><th style="width:34px"><input type="checkbox" id="ba-all" aria-label="Chọn tất cả"></th><th>Mã khách hàng</th><th>Khách hàng</th><th>Kênh / NPP</th><th>Trạng thái</th><th class="num">Sản lượng</th></tr></thead><tbody id="ba-rows"></tbody></table></div>
    <div class="form-grid"><label class="field"><span>Ngày duyệt</span><input type="date" id="ba-date" value="${today()}"></label><div class="small" id="ba-sum" style="align-self:end;padding-bottom:10px"></div></div>`,
    foot:`<button class="btn" data-close>Hủy</button><button class="btn primary" id="ba-go" data-w>Duyệt</button>`,
    mount(){
      const shown=()=>{ const q=norm(st.q).trim(); return cand.filter(c=>(!q||norm([c.name,c.code].join(' ')).includes(q)) && (!st.nppOn || (c.distributor||'')===st.npp) && (!st.reg||regStatus(c)===st.reg) && (!st.vol||cv.get(c.id))); };
      const draw=()=>{ const rs=shown();
        $('#ba-rows').innerHTML=rs.length? rs.map(c=>`<tr><td><input type="checkbox" data-id="${esc(c.id)}" ${sel.has(c.id)?'checked':''}></td><td class="mono">${esc(c.code)}</td><td><div class="cell-main">${esc(c.name)}</div><div class="cell-sub">${esc(custArea(c)||'')}</div></td><td class="small">${esc(c.distributor? nppShort(c.distributor) : '—')}</td><td><span class="chip plain ${REG_CLASS[regStatus(c)]||''}">${regStatus(c)}</span></td><td class="num">${cv.get(c.id)? num(cv.get(c.id))+' tấm' : '<span class="muted">—</span>'}</td></tr>`).join('') : '<tr><td colspan="6" class="empty">Không có khách khớp bộ lọc.</td></tr>';
        const all=$('#ba-all'); all.checked=rs.length>0 && rs.every(c=>sel.has(c.id)); all.indeterminate=!all.checked && rs.some(c=>sel.has(c.id));
        const pick=rs.filter(c=>sel.has(c.id)), n=pick.length, vol=pick.reduce((t,c)=>t+(cv.get(c.id)||0),0);
        $('#ba-sum').innerHTML=`Đã chọn <b>${n}</b> / ${rs.length} khách đang hiện${vol? ' · <b>'+num(vol)+' tấm</b> sẽ được ghi nhận':''}`;
        $('#ba-go').textContent= n? 'Duyệt '+n+' khách' : 'Duyệt'; $('#ba-go').disabled=!n; };
      $('#ba-q').oninput=e=>{ st.q=e.target.value; draw(); };
      $('#ba-npp').onchange=e=>{ st.npp=e.target.value; st.nppOn=e.target.selectedIndex>0; draw(); };
      $('#ba-reg').onchange=e=>{ st.reg=e.target.value; draw(); };
      $('#ba-vol').onchange=e=>{ st.vol=e.target.checked; draw(); };
      $('#ba-all').onchange=e=>{ shown().forEach(c=> e.target.checked? sel.add(c.id) : sel.delete(c.id)); draw(); };
      $('#ba-rows').addEventListener('change',e=>{ const id=e.target.dataset.id; if(!id) return; e.target.checked? sel.add(id) : sel.delete(id); draw(); });
      draw();
      $('#ba-go').onclick=async()=>{ const ids=shown().filter(c=>sel.has(c.id)).map(c=>c.id), d=$('#ba-date').value||today(); if(!ids.length) return;
        $('#ba-go').disabled=true; let n=0;
        for(const id of ids){ const c=cust(id); if(!c) continue;
          if(!await write(db=>db.collection('customers').doc(id).update({regStatus:'Đã duyệt', codeDate:d, regDate:c.regDate||d, newCode:false, updatedAt:stamp()}))){ $('#ba-go').disabled=false; toast('Đã duyệt '+n+' khách, dừng ở '+c.name+'.','bad'); return; }
          n++; }
        toast('Đã duyệt '+n+' khách hàng · sản lượng đã được ghi nhận'); closeOverlay(true); };
    }});
}
function grantCode(id){

    <label class="field"><span>Ngày duyệt</span><input type="date" id="gc-date" value="${esc(c.codeDate||today())}"></label></div>

    foot:`<button class="btn" data-close>Hủy</button><button class="btn primary" id="gcSave">Duyệt</button>`,
    mount(){ $('#gc-code').focus(); $('#gcSave').onclick=async()=>{

      if(S.customers.some(x=>x.id!==id && [x.code,...otherCodes(x)].some(k=>(k||'').toUpperCase()===code))) return toast('Mã '+code+' đã thuộc khách khác.','bad');

      if(await write(db=>db.collection('customers').doc(id).update({code, erpCode:erp, newCode:false, codeDate:$('#gc-date').value||today(), regStatus:'Đã duyệt', regDate:c.regDate||today(), updatedAt:stamp()}),'Đã duyệt '+c.name+' · '+code)) closeOverlay();
    }; }});
}

          code, erpCode:[code,...otherCodes(tgt||{}).filter(k=>k.toUpperCase()!==code)].filter(Boolean).join(', '), newCode:(tgt&&tgt.newCode&&!code)||false, regDate:v('rdate')||null, codeDate:v('cdate')||(st==='Đã duyệt'?today():null), regStatus:st, signedCustomer:$('#rf-sc').checked, signedNpp:$('#rf-sn').checked, regDocs:docs, updatedAt:stamp()};
        if(tgt && tgt.name && norm(tgt.name)!==norm(name)) data.aliases=[...new Set([...(tgt.aliases||[]), tgt.name])];

      };
    }});

    ${(a.docs||[]).length?`<div><h3 style="margin-bottom:6px">Báo cáo đã ký đính kèm</h3><div class="doc-list">${a.docs.map(d=>docRow(d)).join('')}</div></div>`:''}`,

function parsePaste(txt){
  const isNum=s=>/^\d[\d.,]*$/.test(s);
  return txt.split(/\r?\n/).map(l=>l.split('\t').map(s=>s.trim())).filter(c=>c.some(Boolean)).map(cells=>{
    let cs=[...cells]; if(cs.length>2 && /^\d{1,3}$/.test(cs[0])) cs.shift();
    let qi=-1; for(let i=cs.length-1;i>=0;i--) if(isNum(cs[i])){ qi=i; break; }
    if(qi<0) return null;
    const qty=+cs[qi].replace(/[.,]/g,'');
    const texts=cs.filter((s,i)=>i!==qi && s && !isNum(s) && !/^PNP[-\s]?\d+$/i.test(s));
    return {storeName:texts[0]||'', area:texts[1]||'', note:texts[2]||'', qty};
  }).filter(r=>r && r.storeName && !/^t[oổ]ng/i.test(norm(r.storeName)) && !/^ton kho|^nhap kho/.test(norm(r.storeName)));
}

    foot:`<button class="btn" data-close>Hủy</button><button class="btn primary" id="faSave">${icon('save')} Lưu báo cáo</button>`,

        const tot=e.rows.reduce((s,r)=>s+(+r.qty||0),0); $('#fa-tot').textContent=num(tot);
        { const pv=$('#fa-price').value, fb=listPrice($('#fa-npp').value,$('#fa-prod').value,$('#fa-month').value), pr= pv!==''? +pv : fb;

        const named=e.rows.filter(r=>r.storeName.trim());
        const nNew=named.filter(r=>!allocCust(r)).length, unc=named.filter(r=>{const c=allocCust(r); return c&&!hasCode(c);});
        const uq=named.filter(r=>!hasCode(allocCust(r))).reduce((s,r)=>s+(+r.qty||0),0);
        $('#fa-codeNote').innerHTML = named.length && (nNew||unc.length) ? `<div class="note">${unc.length? unc.length+' cửa hàng chưa được duyệt':''}${unc.length&&nNew?', ':''}${nNew? nNew+' cửa hàng mới chưa có hồ sơ':''}. ${num(uq)} tấm sẽ chưa được ghi nhận vào CTKM tour cho tới khi khách được duyệt.</div>` : (named.length?'<div class="note ok">Tất cả cửa hàng đã đã duyệt.</div>':'');
        const o=$('#fa-open').value, im=$('#fa-imp').value, cl=$('#fa-close').value;
        if(o!==''||im!==''){ const exp=(+o||0)+(+im||0)-tot;
          $('#fa-stockNote').innerHTML = cl===''? `<div class="note ok">Tồn kho cuối tháng theo tính toán: ${num(exp)} tấm (tồn đầu + nhập − phân bổ).</div>` : (+cl===exp? '<div class="note ok">Tồn kho khớp: tồn đầu + nhập − phân bổ = tồn cuối.</div>' : `<div class="note">Tồn kho lệch ${num(Math.abs(+cl-exp))} tấm: tồn đầu + nhập − phân bổ = ${num(exp)} tấm, nhưng tồn cuối ghi ${num(+cl)} tấm.</div>`);
        } else $('#fa-stockNote').innerHTML='';
      };
      const draw=()=>{ tb.innerHTML=e.rows.map((r,i)=>`<tr data-i="${i}"><td class="num muted">${i+1}</td><td data-code>${codeCell(r)}</td><td><input type="text" list="dl-stores" data-k="storeName" value="${esc(r.storeName)}"></td><td><input type="text" list="dl-area" data-k="area" value="${esc(r.area||'')}"></td><td><input type="number" min="0" class="num" data-k="qty" value="${r.qty||''}"></td><td><select data-k="promo"><option value="">Tự động</option>${S.promos.filter(isVolProg).map(p=>`<option value="${esc(p.id)}" ${r.promo===p.id?'selected':''}>${esc(p.code)} · ${isFO(p)?'First order':'Tour'}</option>`).join('')}<option value="none" ${r.promo==='none'?'selected':''}>Không tham gia</option></select></td><td><input type="text" data-k="note" value="${esc(r.note||'')}"></td><td><button class="icon-btn" data-rm type="button" title="Xóa dòng">${icon('x')}</button></td></tr>`).join(''); calc(); };
      tb.addEventListener('input',ev=>{ const tr=ev.target.closest('tr'); if(!tr) return; const r=e.rows[+tr.dataset.i], k=ev.target.dataset.k;
        if(k==='qty') r.qty=Math.max(0,+ev.target.value||0); else r[k]=ev.target.value;
        if(k==='storeName'){ const c=matchCustomer(r.storeName); r.customerId=c?c.id:null; if(c&&!r.area&&custArea(c)){ r.area=custArea(c); tr.querySelector('[data-k=area]').value=r.area; } tr.querySelector('[data-code]').innerHTML=codeCell(r); }

      $('#fa-pasteBtn').onclick=()=>{ const p=$('#fa-paste'); p.hidden=!p.hidden; if(!p.hidden) $('#fa-pasteTxt').focus(); };
      $('#fa-pasteGo').onclick=()=>{ const rows=parsePaste($('#fa-pasteTxt').value); if(!rows.length) return toast('Không đọc được dòng nào. Mỗi dòng cần có tên cửa hàng và số tấm.','bad');
        rows.forEach(r=>{ const c=matchCustomer(r.storeName); r.customerId=c?c.id:null; if(!r.area&&c&&custArea(c)) r.area=custArea(c); });
        e.rows=e.rows.filter(r=>r.storeName.trim()||r.qty).concat(rows); $('#fa-pasteTxt').value=''; $('#fa-paste').hidden=true; draw(); toast('Đã thêm '+rows.length+' dòng'); };
      ['fa-open','fa-imp','fa-close','fa-price'].forEach(id=>$('#'+id).addEventListener('input',calc));
      const suggest=()=>{ const npp=$('#fa-npp').value, prod=$('#fa-prod').value, m=$('#fa-month').value;
        const prev=[...S.allocations].filter(x=>x.id!==e.id && +x.price>0 && norm(x.distributor)===norm(npp) && norm(x.product)===norm(prod) && (!m||x.month<=m)).sort((a,b)=>b.month.localeCompare(a.month))[0];

        el.placeholder = prev? 'Tháng '+monthMM(prev.month)+': '+num(prev.price) : fb!=null? 'Bảng giá: '+num(fb) : 'Chưa có giá';
        if(!a && !el.dataset.touched && prev) el.value=prev.price;
        calc(); };
      $('#fa-price').addEventListener('input',ev=>{ ev.target.dataset.touched='1'; });
      ['fa-npp','fa-prod','fa-month'].forEach(id=>$('#'+id).addEventListener('change',suggest));
      $('#fa-month').addEventListener('change',labels);
      const drawDocs=()=>{ $('#fa-docs').innerHTML=e.docs.map((d,i)=>docRow(d,null,i)).join(''); $$('#fa-docs [data-rmdoc]').forEach(b=>b.onclick=()=>{ e.docs.splice(+b.dataset.rmdoc,1); drawDocs(); }); };
      if(!S.assets) $('#fa-up').innerHTML='<span class="muted small">Đính kèm báo cáo cần quyền chỉnh sửa trang này.</span>';
      else $('#fa-file').addEventListener('change', async ev=>{ const files=[...ev.target.files]; ev.target.value=''; const up=await uploadFiles(files,'Báo cáo phân bổ sản lượng',$('#fa-hint'),'PDF có chữ ký số hoặc ảnh chụp bản có dấu.'); e.docs.push(...up); newUploads.push(...up); if(up.length) $('#fa-conf').checked=true; drawDocs(); });
      draw(); drawDocs(); labels(); suggest();
      if(pre && pre.file && S.assets && /\.(pdf|png|jpe?g|csv)$/i.test(pre.file.name)) uploadFiles([pre.file],'Báo cáo phân bổ sản lượng',$('#fa-hint'),'PDF có chữ ký số hoặc ảnh chụp bản có dấu.').then(up=>{ e.docs.push(...up); newUploads.push(...up); drawDocs(); });
      $('#faSave').onclick=async()=>{
        const v=id=>$('#fa-'+id).value.trim();
        const month=v('month'), npp=v('npp'), prod=v('prod'), prov=v('prov');
        if(!month||!npp||!prod) return toast('Vui lòng nhập tháng, nhà phân phối và sản phẩm.','bad');
        const rows=e.rows.filter(r=>r.storeName.trim()).map(r=>({customerId:r.customerId||null, storeName:r.storeName.trim(), area:(r.area||'').trim(), qty:+r.qty||0, note:(r.note||'').trim(), promo:r.promo||''}));
        if(!rows.length) return toast('Báo cáo cần ít nhất một cửa hàng.','bad');
        const dup=S.allocations.find(x=>x.id!==e.id && x.month===month && norm(x.distributor)===norm(npp) && norm(x.product)===norm(prod) && norm(x.province||'')===norm(prov));
        if(dup) return toast('Đã có báo cáo '+monthMM(month)+' của NPP này cho sản phẩm '+prod+'. Hãy mở báo cáo đó để sửa.','bad');
        if(!S.db) return toast('Chưa kết nối kho dữ liệu nên không lưu được.','bad');
        $('#faSave').disabled=true;
        if($('#fa-mk').checked){
          const made=new Map();
          for(const r of rows){ if(r.customerId && cust(r.customerId)) continue; const c=matchCustomer(r.storeName); if(c){ r.customerId=c.id; continue; }
            const key=norm(r.storeName).trim(); if(made.has(key)){ r.customerId=made.get(key); continue; }
            const ref=S.db.collection('customers').doc();
            const ok=await write(()=>ref.set({code:'', name:r.storeName, area:r.area, city:cityFromArea(r.area)||prov, distributor:npp, regStatus:'Chưa đăng ký', source:'Báo cáo phân bổ sản lượng', createdAt:today(), updatedAt:stamp()}));
            if(!ok){ $('#faSave').disabled=false; return; }
            r.customerId=ref.id; made.set(key, ref.id); }
        }
        const removed=a? (a.docs||[]).filter(d=>!e.docs.some(x=>x.id===d.id)) : [];
        const data={month, province:prov, distributor:npp, product:prod, reportDate:v('date')||null, price:v('price')===''?null:+v('price'), rows, total:rows.reduce((s,r)=>s+r.qty,0),
          stock:{opening:v('open')===''?null:+v('open'), import:v('imp')===''?null:+v('imp'), closing:v('close')===''?null:+v('close')}, docs:e.docs, confirmed:$('#fa-conf').checked, signer:npp, updatedAt:stamp()};
        if(a && a.sample) data.sample=true;
        if(!a) data.createdAt=stamp();
        const aref=S.db.collection('allocations').doc(a? a.id : undefined);
        const ok=await write(()=>aref.set(data), (a?'Đã cập nhật':'Đã lưu')+' báo cáo '+monthMM(month));
        $('#faSave').disabled=false;
        if(ok){
          const base={type:'alloc', npp, month, refType:'alloc', refId:aref.id};
          if(pre) await logUpload({...base, fileName:pre.file.name, size:pre.file.size, summary:`${rows.length} cửa hàng · ${num(data.total)} tấm · ${prod}${pre.replacing?' (thay báo cáo cũ)':''}`, assetId:(newUploads.find(d=>d.name===pre.file.name)||{}).id||''});
          for(const d of newUploads.filter(d=>!(pre && d.name===pre.file.name))) await logUpload({...base, fileName:d.name, size:d.size, summary:'Đính kèm vào báo cáo '+monthMM(month)+' · '+prod, assetId:d.id}); if(S.assets) for(const d of removed){ try{ await S.assets.delete(d.id);}catch(_){} } closeOverlay(true); }
      };
    }});

function tourPerf(p){ return cached('tp-'+p.id, ()=>{
  const m0=(p.start||'').slice(0,7), m1=(p.end||'').slice(0,7);
  const prods=(p.products||[]).map(x=>norm(x).trim()).filter(Boolean), npps=(p.distributors||[]).map(x=>norm(x).trim()).filter(Boolean);
  const rows=allocFlat().filter(x=>x.promoId===p.id);
  const foExcluded=allocFlat().filter(x=>x.promoId && x.promoId!==p.id && isFO(promoMap().get(x.promoId)) && tourMatch(p,x)).reduce((t,x)=>t+x.qty,0);
  const months=[]; { let y=+m0.slice(0,4), m=+m0.slice(5,7); while(m0 && months.length<36){ const k=y+'-'+pad(m); if(k>m1) break; months.push(k); m++; if(m>12){m=1;y++;} } }
  const ok=x=>x.counted || p.requireCode===false;
  const by=new Map();
  for(const x of rows){ const key=x.c? x.c.id : 'n:'+norm(x.r.storeName); let s=by.get(key);
    if(!s){ s={key, c:x.c, name:x.c?x.c.name:x.r.storeName, area:x.r.area||custArea(x.c), npp:x.npp, months:{}, total:0, counted:ok(x)}; by.set(key,s); }
    s.months[x.month]=(s.months[x.month]||0)+x.qty; s.total+=x.qty; }
  const tiers=[...(p.tiers||[])].filter(t=>+t.min>0).sort((a,b)=>a.min-b.min);
  const list=[...by.values()].map(s=>{ let tier=null; for(const t of tiers) if(s.total>=t.min) tier=t;
    const next=tiers.find(t=>t.min>s.total)||null;
    return {...s, tier: s.counted? tier:null, potential: s.counted? null:tier, next, gap: next? next.min-s.total:0, registered: !!(s.c && s.c.tourId===p.id)}; }).sort((a,b)=>b.total-a.total);
  const volume=rows.reduce((t,x)=>t+x.qty,0), counted=list.filter(s=>s.counted).reduce((t,s)=>t+s.total,0);
  const q=list.filter(s=>s.tier);
  const cost=q.reduce((t,s)=>t+(+s.tier.cost||0)*(+s.tier.slots||1),0), slots=q.reduce((t,s)=>t+(+s.tier.slots||1),0);
  const byMonth=months.map(m=>({m, counted:rows.filter(x=>x.month===m&&ok(x)).reduce((t,x)=>t+x.qty,0), pending:rows.filter(x=>x.month===m&&!ok(x)).reduce((t,x)=>t+x.qty,0)}));
  return {months, list, tiers, volume, counted, pending:volume-counted, participants:list.length, qualified:q.length, potential:list.filter(s=>s.potential).length,
    cost, slots, byMonth, foExcluded, tierCount:tiers.map(t=>({t, n:q.filter(s=>s.tier===t).length, near:list.filter(s=>s.counted&&s.next===t&&s.gap<=t.min*0.2).length})),
    registered:S.customers.filter(c=>c.tourId===p.id).length,
    budgetPct:p.budget? cost/p.budget:null, targetPct:p.targetVolume? counted/p.targetVolume:null, costPerUnit:counted? cost/counted:null};
}); }
function tourRows(p){ const f=tourPerf(p); return f.list.map((s,i)=>{ const o={'Hạng':i+1,'Cửa hàng':s.name,'Mã khách hàng':s.c?.code||'','Khu vực':s.area,'Nhà phân phối':s.npp};
  f.months.forEach(m=>o['T'+monthMM(m)]=s.months[m]||0); o['Tổng (tấm)']=s.total; o['Ghi nhận']=s.counted?'Có':'Chưa duyệt'; o['Mức đạt']=s.tier? s.tier.reward : (s.potential? 'Đủ sản lượng '+s.potential.reward+' (chờ duyệt)':''); o['Còn thiếu đến mức tiếp theo (tấm)']=s.next? s.gap:''; return o; }); }

/* =====================================================================
   FIRST ORDER CTKM (volume of a customer's first month, excluded from tour)
   ===================================================================== */
function foPerf(p){ return cached('fo-'+p.id, ()=>{
  const rows=allocFlat().filter(x=>x.promoId===p.id), ok=x=>x.counted || p.requireCode===false;
  const by=new Map();
  rows.forEach(x=>{ let s=by.get(x.ckey); if(!s){ s={key:x.ckey, c:x.c, name:x.c?x.c.name:x.r.storeName, area:x.r.area||custArea(x.c), npp:x.npp, month:x.month, total:0, counted:ok(x), months:{}}; by.set(x.ckey,s); }
    s.total+=x.qty; s.months[x.month]=(s.months[x.month]||0)+x.qty; if(x.month<s.month) s.month=x.month; });
  const unit=+p.supportPerUnit||0, fixed=+p.supportFixed||0;
  const list=[...by.values()].map(s=>{ const amt=s.total*unit+fixed; return {...s, support:s.counted?amt:0, potential:s.counted?0:amt}; }).sort((a,b)=>b.total-a.total);
  const volume=list.reduce((t,s)=>t+s.total,0), counted=list.filter(s=>s.counted).reduce((t,s)=>t+s.total,0), cost=list.reduce((t,s)=>t+s.support,0);
  const nOk=list.filter(s=>s.counted).length;
  return {list, volume, counted, pending:volume-counted, customers:list.length, countedCustomers:nOk, cost, potentialCost:list.reduce((t,s)=>t+s.potential,0),
    budgetPct:p.budget? cost/p.budget:null, targetPct:p.targetCustomers? nOk/p.targetCustomers:null, costPerUnit:counted? cost/counted:null};
}); }
const foEntry = (p, cid) => cached('fe-'+p.id, ()=>new Map(foPerf(p).list.map(s=>[s.key,s]))).get(cid);
const progEntry = (p, cid) => isFO(p)? foEntry(p,cid) : tourEntry(p,cid);
const progPerf = p => isFO(p)? foPerf(p) : tourPerf(p);
function progCell(p, cid, plain){
  if(!isFO(p)) return tourCell(p, cid, plain);
  const s=foEntry(p, cid);
  if(!s) return plain? '' : '<span class="muted">—</span>';
  const res = s.counted? 'Hỗ trợ '+money(s.support) : 'Chờ duyệt';
  if(plain) return res;
  return `<div style="white-space:nowrap"><b>${num(s.total)}</b> tấm · T${monthMM(s.month).slice(0,2)}</div><span class="chip plain ${s.counted?'st-done':'st-proc'}">${esc(res)}</span>`;
}
function progSectionHTML(c, id, vrows){

  const outQ=vrows.filter(x=>!x.promoId).reduce((t,x)=>t+x.qty,0);
  if(!progs.length && !outQ) return '<p class="muted" style="margin:0">Khách chưa có sản lượng thuộc CTKM nào.</p>';
  const rowsH=progs.map(p=>{ const e=progEntry(p,id), ms=Object.keys(e.months).sort();
    const res = isFO(p)? (e.counted? `<span class="chip st-done">Hỗ trợ ${money(e.support)}</span>` : `<span class="chip st-proc">Dự kiến ${money(e.potential)} khi được duyệt</span>`)
      : `${e.tier?`<span class="chip st-done">${esc(e.tier.reward||'Đạt')}</span>`:''}${e.next?`<div class="prog-row" style="min-width:180px"><span style="white-space:nowrap">còn ${num(e.gap)}</span><div class="progress"><i style="width:${Math.min(100,e.total/e.next.min*100)}%"></i></div><b>${pct(e.total/e.next.min,0)}</b></div><div class="cell-sub">tới mức ${num(e.next.min)} tấm: ${esc(e.next.reward||'')}</div>`:(e.tier?'':'<span class="muted small">Mức cao nhất</span>')}`;
    return `<tr class="click" data-promo="${esc(p.id)}"><td><span class="chip plain ${PROG_CLASS(p)}">${progKind(p)}</span><div class="mono" style="font-weight:600;margin-top:3px">${esc(p.code)}</div><div class="cell-sub">${esc(p.name)}</div></td><td class="small">${ms.map(m=>'T'+monthMM(m)+': '+num(e.months[m])+' tấm').join('<br>')}</td><td class="num"><b>${num(e.total)}</b></td><td>${e.counted?'<span class="chip st-done">Đã ghi nhận</span>':'<span class="chip st-proc">Chờ duyệt</span>'}</td><td>${res}</td></tr>`; }).join('');

    <tfoot><tr><td colspan="2">Tổng sản lượng</td><td class="num">${num(vrows.reduce((t,x)=>t+x.qty,0))}</td><td colspan="2"></td></tr></tfoot></table></div>
    <p class="muted small" style="margin:0">Mỗi tấm chỉ tính cho một chương trình: sản lượng đơn đầu tiên (first order) không cộng vào tour promotion. Có thể đổi chương trình cho từng dòng trong báo cáo sản lượng.</p>
    ${!hasCode(c)&&progs.length?'<div class="note">Khách chưa được duyệt nên sản lượng chưa được tính thưởng. Duyệt ở mục Đăng ký PNP.</div>':''}`;
}

const VOUCHER_DEFAULT = {item:'Voucher Got It', unit:'Phiếu', qty:1, value:500000};
const vouchersOf = (cid, pid) => S.vouchers.filter(v=>v.customerId===cid && (!pid || v.promoId===pid));
const proofsOf = (c, pid) => ((c&&c.proofs)||[]).filter(d=>!pid || d.promoId===pid);
const memUrls = new Map();
const docHref = id => memUrls.get(id) || ('/_blob/'+id);
function memAssets(){ return { upload: async(b)=>{ const id='mem'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); memUrls.set(id, URL.createObjectURL(b)); return {id, url:memUrls.get(id), sizeBytes:b.size, contentType:b.type||'application/octet-stream'}; }, delete: async(id)=>{ memUrls.delete(id); } }; }
function pickFiles(accept, multiple){ return new Promise(res=>{ const i=document.createElement('input'); i.type='file'; i.accept=accept; i.multiple=!!multiple; i.hidden=true; document.body.appendChild(i);
  i.addEventListener('change',()=>{ const f=[...i.files]; i.remove(); res(f); }); i.click(); }); }
async function uploadProofs(cid, pid){
  const c=cust(cid); if(!c) return;
  if(!S.assets) return toast('Tải chứng từ cần quyền chỉnh sửa trang này.','bad');
  const files=await pickFiles('application/pdf,image/*', true); if(!files.length) return;
  const up=await uploadFiles(files,'Chứng từ mua hàng'); if(!up.length) return;
  up.forEach(d=>d.promoId=pid);
  if(await write(db=>db.collection('customers').doc(cid).update({proofs:[...(c.proofs||[]), ...up], updatedAt:stamp()}),'Đã tải '+up.length+' chứng từ mua hàng')){
    const p=promoMap().get(pid);
    for(const d of up) await logUpload({type:'proof', fileName:d.name, size:d.size, summary:'Chứng từ mua hàng · '+c.name+(p?' · '+p.code:''), npp:c.distributor||'', refType:'customer', refId:cid, assetId:d.id});
    // read the sale order (PDF/Excel) so its quantities count as volume
    const pdfs=up.map(d=>({d, f:files.find(x=>x.name===d.name)})).filter(x=>x.f && /\.(pdf|xlsx?|csv)$/i.test(x.f.name));
    for(const x of pdfs){ let o=null; try{ o=await readSaleOrder(x.f); }catch(e){ console.warn(e); }
      if(o && o.lines.length){ saleOrderForm(cid, pid, x.d.id, o, true); return; } }
    if(up.length) toast('Đã tải chứng từ. Bấm “Số liệu đơn hàng” để nhập số lượng tấm, sản lượng sẽ hiện ở Tổng quan.');
  }
}
async function removeProof(cid, assetId){
  const c=cust(cid); if(!c) return;
  confirmBox('Gỡ chứng từ này?','File sẽ bị xóa khỏi hồ sơ khách hàng.','Gỡ', async()=>{
    if(await write(db=>db.collection('customers').doc(cid).update({proofs:(c.proofs||[]).filter(d=>d.id!==assetId), updatedAt:stamp()}),'Đã gỡ chứng từ')){ if(S.assets) try{ await S.assets.delete(assetId); }catch(_){} } });
}
function voucherForm(cid, pid, v){
  const p=promoMap().get(pid||v?.promoId) || S.promos.find(isFO);
  const e=v? {...v} : {customerId:cid||'', promoId:p?.id||'', item:p?.voucherItem||VOUCHER_DEFAULT.item, unit:VOUCHER_DEFAULT.unit, qty:1, value:p?.voucherValue||VOUCHER_DEFAULT.value, serial:'', date:today(), note:''};
  const fos=S.promos.filter(isFO);
  let hand=e.handover||null, newUp=null;
  openModal({title: v? 'Sửa phiếu giao voucher' : 'Giao voucher first order', body:`
    <div class="form-grid">
      <label class="field full"><span>Khách hàng *</span><select id="vf-c">${cid? '' : '<option value="">Chọn khách hàng</option>'}${[...S.customers].sort((a,b)=>a.name.localeCompare(b.name,'vi')).map(c=>`<option value="${esc(c.id)}" ${e.customerId===c.id?'selected':''}>${esc(c.name)}${c.code?' · '+esc(c.code):''}</option>`).join('')}</select></label>
      <label class="field"><span>Chương trình</span><select id="vf-p">${fos.map(x=>`<option value="${esc(x.id)}" ${e.promoId===x.id?'selected':''}>${esc(x.code)} · ${esc(x.name)}</option>`).join('')}</select></label>
      <label class="field"><span>Ngày tặng</span><input type="date" id="vf-date" value="${esc(e.date||today())}"></label>
      <label class="field"><span>Tên hàng hóa</span><input type="text" id="vf-item" value="${esc(e.item)}"></label>
      <label class="field"><span>ĐVT</span><input type="text" id="vf-unit" value="${esc(e.unit)}"></label>
      <label class="field"><span>Số lượng</span><input type="number" min="1" id="vf-qty" value="${e.qty||1}"></label>
      <label class="field"><span>Mệnh giá (₫)</span><input type="number" min="0" step="1000" id="vf-val" value="${e.value||0}"></label>
      <label class="field full"><span>Số seri</span><input type="text" id="vf-ser" class="mono" value="${esc(e.serial||'')}" placeholder="VD: 215500011068 (nhiều phiếu cách nhau dấu phẩy)"></label>
      <label class="field full"><span>Ghi chú</span><input type="text" id="vf-note" value="${esc(e.note||'')}"></label>
    </div>
    <div id="vf-cinfo"></div>
    <div class="grid" style="gap:6px"><h3>Biên bản bàn giao đã ký</h3><div class="doc-list" id="vf-hand"></div>
      <div class="uploader"><label class="btn sm">${icon('up')} Đính kèm biên bản đã ký<input type="file" id="vf-file" accept="application/pdf,image/*" hidden></label><span class="muted small" id="vf-hint">Tải biên bản mẫu ở nút bên dưới, in ra ký rồi đính kèm bản scan.</span></div></div>`,
    foot:`<button class="btn" id="vf-bb" style="margin-right:auto">${icon('down')} Biên bản bàn giao</button><button class="btn" data-close>Hủy</button>${v?`<button class="btn danger" data-w id="vf-del">Xóa</button>`:''}<button class="btn primary" id="vf-save">${icon('save')} Lưu</button>`,
    onClose: async(saved)=>{ if(!saved && newUp && S.assets) try{ await S.assets.delete(newUp.id); }catch(_){} },

function importVoucherFile(pid){
  pickFiles('.xlsx,.xls,.csv').then(async files=>{ const f=files[0]; if(!f) return;
    if(!window.XLSX) return toast('Không tải được thư viện Excel.','bad');
    let rows=[];
    try{ const wb=XLSX.read(await f.arrayBuffer(),{type:'array', cellDates:true});
      for(const n of wb.SheetNames){ const L=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1, raw:false, defval:'', dateNF:'yyyy-mm-dd'}).map(r=>r.map(v=>String(v).trim()));
        const hi=L.findIndex(r=>r.some(v=>norm(v)==='ten kh') && r.some(v=>norm(v).startsWith('so seri'))); if(hi<0) continue;
        const H=L[hi].map(v=>norm(v)); const col=k=>H.findIndex(h=>h===k||h.startsWith(k));
        const ix={name:col('ten kh'), addr:col('dia chi'), tax:col('mst'), item:col('ten hang hoa'), unit:col('dvt'), qty:col('so luong'), val:col('menh gia'), ser:col('so seri'), date:col('ngay tang')};
        rows=L.slice(hi+1).filter(r=>r[ix.name]).map(r=>({name:r[ix.name], address:r[ix.addr]||'', taxCode:r[ix.tax]||'', item:r[ix.item]||VOUCHER_DEFAULT.item, unit:r[ix.unit]||VOUCHER_DEFAULT.unit, qty:toNum(r[ix.qty])||1, value:toNum(r[ix.val])||0, serial:r[ix.ser]||'', date:toISODate(r[ix.date])||String(r[ix.date]).slice(0,10)}));
        break; }
    }catch(e){ return toast('Không đọc được file.','bad'); }
    if(!rows.length) return toast('Không tìm thấy bảng có cột “Tên KH” và “Số Seri”.','bad');
    voucherImportReview(rows, f, pid);
  });
}

/* =====================================================================
   SALE ORDER (Đơn hàng bán) read from the purchase proof → volume
   ===================================================================== */
const soDate = (d,m,y) => y+'-'+pad(+m)+'-'+pad(+d);
const SO_DOCTYPES = ['Đơn hàng bán','Hóa đơn GTGT','Phiếu xuất kho','Phiếu giao hàng','Khác'];
function soDocType(N){
  if(/hoa don gia tri gia tang|vat invoice|hoa don gtgt|hoa don ban hang/.test(N)) return 'Hóa đơn GTGT';
  if(/phieu xuat kho/.test(N)) return 'Phiếu xuất kho';
  if(/phieu giao hang|bien ban giao hang/.test(N)) return 'Phiếu giao hàng';
  if(/don hang ban|don dat hang|sale order|sales order/.test(N)) return 'Đơn hàng bán';
  return ''; }
function parseSaleOrder(sheet, fname){
  const lines=sheet.lines.map(c=>c.map(x=>String(x).trim()).filter(Boolean)).filter(c=>c.length);
  const all=lines.map(c=>c.join(' ')).join('\n'), N=norm(all);
  const o={docType:soDocType(N), no:'', serial:'', date:'', month:'', npp:'', buyer:'', buyerTax:'', seller:'', sales:'', note:'', lines:[], subtotal:null, vat:null, total:null};
  let m=N.match(/so\s*(?:ct|chung tu|don hang|don|hoa don)\s*(?:\([^)]*\))?\s*[:.]?\s*([a-z]{0,5}\d[\w.\-\/]*)/); if(m) o.no=m[1].toUpperCase();

function parseMonth(v){
  if(v==null || v==='') return '';
  if(typeof v==='number' && v>20000){ const d=new Date(Math.round((v-25569)*864e5)); return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1); }
  const t=norm(String(v)).trim(); let m;
  if((m=t.match(/^(\d{4})[-\/.](\d{1,2})/))) return m[1]+'-'+pad(+m[2]);
  if((m=t.match(/^(?:\d{1,2}[-\/.])?(\d{1,2})[-\/.](\d{4})$/))) return m[2]+'-'+pad(+m[1]);
  if((m=t.match(/^(?:t|thang)\s*(\d{1,2})[\s\/.-]+(\d{4})$/))) return m[2]+'-'+pad(+m[1]);
  if((m=t.match(/^([a-z]{3})[a-z]*[\s\-\/']+(\d{2,4})$/)) && MON[m[1]]) return (m[2].length===2?'20'+m[2]:m[2])+'-'+pad(MON[m[1]]);
  return ''; }

async function importMarketFile(kind){
  if(!S.canWrite) return toast('Bạn chỉ có quyền xem.','bad');
  const files=await pickFiles('.xlsx,.xls,.csv', false); const file=files[0]; if(!file) return;
  if(!window.XLSX) return toast('Không tải được thư viện Excel.','bad');
  let t; try{ t=await readTemplateRows(file, kind==='price'? ['thuong hieu','gia'] : ['tong','khach hang']); }catch(e){ return toast(e.message,'bad'); }
  const h=t.head, items=[], bad=[];
  if(kind==='price'){
    const iM=col(h,'thang','month'), iB=col(h,'thuong hieu','brand'), iP=col(h,'nhom san pham','san pham'), iS=col(h,'quy cach'), iN=col(h,'kenh','npp'), iA=col(h,'khu vuc'), iG=col(h,'gia'), iX=col(h,'nguon','ghi chu');
    t.rows.forEach((r,k)=>{ const month=parseMonth(r[iM]), brand=String(r[iB]||'').trim(), price=numCell(r[iG]);
      if(/vi du/.test(norm(brand))) return;
      if(!month||!brand||!price){ bad.push(k+1); return; }
      items.push({month, brand, product:String(r[iP]||'').trim(), spec:iS>=0? String(r[iS]||'').trim():'', npp:iN>=0? String(r[iN]||'').trim():'', area:iA>=0? String(r[iA]||'').trim():'', price, note:iX>=0? String(r[iX]||'').trim():''}); });
  } else {
    const iM=col(h,'thang','month'), iC=col(h,'ma khach','ma kh'), iT=col(h,'ten khach'), iV=col(h,'tong'), iP=col(h,'panel plus'), iO=col(h,'thuong hieu khac'), iX=col(h,'ghi chu');
    const byCode=new Map(S.customers.filter(c=>c.code).map(c=>[c.code.toUpperCase(), c]));
    t.rows.forEach((r,k)=>{ const month=parseMonth(r[iM]), name=String(r[iT]||'').trim(), code=String(r[iC]||'').trim().toUpperCase(), total=numCell(r[iV]);
      if(/vi du/.test(norm(name))) return;
      if(!month||(!name&&!code)||!total){ bad.push(k+1); return; }
      const c=(code&&byCode.get(code)) || matchCustomer(name);
      items.push({month, customerId:c?c.id:'', code, name:c?c.name:name, total, pp:iP>=0? numCell(r[iP]) : null, other:iO>=0? String(r[iO]||'').trim():'', note:iX>=0? String(r[iX]||'').trim():''}); });
  }
  if(!items.length) return toast('Không có dòng hợp lệ trong file'+(bad.length?' ('+bad.length+' dòng thiếu tháng / tên / số)':'')+'.','bad');
  const colName= kind==='price'? 'marketPrices' : 'sowData', list= kind==='price'? S.mprices : S.sow;
  const keyOf= kind==='price'? x=>[x.month,norm(x.brand),norm(x.product),norm(x.spec),norm(x.npp),norm(x.area)].join('|') : x=>[x.month, x.customerId||norm(x.name)].join('|');
  const old=new Map(list.map(x=>[keyOf(x), x])); const repl=items.filter(x=>old.has(keyOf(x))).length;
  const months=[...new Set(items.map(x=>x.month))].sort();
  const sum = kind==='price'? `${items.length} giá · ${new Set(items.map(x=>x.brand)).size} thương hiệu · ${months.map(monthMM).join(', ')}` : `${items.length} dòng · ${new Set(items.map(x=>x.customerId||x.name)).size} khách (${items.filter(x=>!x.customerId).length} chưa khớp CRM) · ${months.map(monthMM).join(', ')}`;
  openModal({title: kind==='price'? 'Nhập giá thị trường' : 'Nhập SOW khách hàng', body:`<p style="margin:0"><b>${esc(file.name)}</b>: ${esc(sum)}.</p>
    ${repl?`<div class="note">${repl} dòng đã có (cùng tháng${kind==='price'?', thương hiệu, sản phẩm, kênh':', khách'}) sẽ được thay bằng số mới.</div>`:''}
    ${bad.length?`<div class="note">Bỏ qua ${bad.length} dòng thiếu tháng, tên hoặc số (dòng ${bad.slice(0,8).join(', ')}${bad.length>8?'…':''} sau tiêu đề).</div>`:''}`,
    foot:`<button class="btn" data-close>Hủy</button><button class="btn primary" id="mk-go" data-w>Nhập ${items.length} dòng</button>`,
    mount(){ $('#mk-go').onclick=async()=>{ $('#mk-go').disabled=true;
      for(const x of items){ const o=old.get(keyOf(x)); const ref=o? S.db.collection(colName).doc(o.id) : S.db.collection(colName).doc();
        if(!await write(()=>ref.set({...x, file:file.name, updatedAt:stamp()}))){ $('#mk-go').disabled=false; return; } }
      await logUpload({type:kind, fileName:file.name, size:file.size, summary:(kind==='price'?'Giá thị trường: ':'SOW: ')+sum, month:months[months.length-1]||''});
      toast('Đã nhập '+items.length+' dòng'); closeOverlay(true); }; }});
}
async function clearMarket(kind, ids){
  const colName= kind==='price'? 'marketPrices' : 'sowData';
  confirmBox('Xóa '+ids.length+' dòng?', 'Dữ liệu '+(kind==='price'?'giá':'SOW')+' đang lọc sẽ bị xóa.', 'Xóa', async()=>{ for(const id of ids){ if(!await write(db=>db.collection(colName).doc(id).delete())) return; } toast('Đã xóa '+ids.length+' dòng'); });
}

const skeyOf = x => x.c ? x.c.id : 'n:'+norm(x.r.storeName);
function anaRows(){ const u=S.ui.ana;
  return allocFlat().filter(x=>(!u.m0||x.month>=u.m0)&&(!u.m1||x.month<=u.m1)&&(!u.npp||x.npp===u.npp)&&(!u.prod||x.product===u.prod)&&(!u.prov||x.province===u.prov)&&typeOk(x,u.ct)); }
function sparkSVG(vals){
  const w=84, h=22, mx=Math.max(1,...vals); if(vals.length<2) return '';
  const pts=vals.map((v,i)=>[(i/(vals.length-1))*(w-4)+2, h-2-(v/mx)*(h-4)]);
  const last=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><polyline fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" points="${pts.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ')}"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.4" fill="currentColor"/></svg>`;
}
function anaData(){
  const u=S.ui.ana, rows=anaRows();
  const months=[...new Set(rows.map(x=>x.month))].sort();
  const prods=[...new Set(rows.map(x=>x.product))].sort();
  const val=x=>u.metric==='rev'? x.rev : x.qty;
  const nppM=new Map(), custM=new Map();
  for(const x of rows){
    let n=nppM.get(x.npp); if(!n){ n={npp:x.npp, qty:0, rev:0, cust:new Set(), prod:new Map(), last:'', unpriced:0}; nppM.set(x.npp,n); }
    n.qty+=x.qty; n.rev+=x.rev; n.cust.add(skeyOf(x)); n.prod.set(x.product,(n.prod.get(x.product)||0)+x.qty); if(x.month>n.last) n.last=x.month; if(!x.priced) n.unpriced+=x.qty;
    const k=skeyOf(x)+'|'+x.npp; let c=custM.get(k);
    if(!c){ c={key:k, c:x.c, name:x.c?x.c.name:x.r.storeName, area:x.r.area||custArea(x.c), npp:x.npp, qty:0, rev:0, prodQ:{}, prodR:{}, months:{}, monthsQ:{}, last:''}; custM.set(k,c); }
    c.qty+=x.qty; c.rev+=x.rev; c.prodQ[x.product]=(c.prodQ[x.product]||0)+x.qty; c.prodR[x.product]=(c.prodR[x.product]||0)+x.rev;
    c.months[x.month]=(c.months[x.month]||0)+val(x); c.monthsQ[x.month]=(c.monthsQ[x.month]||0)+x.qty; if(x.month>c.last) c.last=x.month;
  }
  const tot={qty:rows.reduce((s,x)=>s+x.qty,0), rev:rows.reduce((s,x)=>s+x.rev,0), unpriced:rows.filter(x=>!x.priced).reduce((s,x)=>s+x.qty,0)};
  const npps=[...nppM.values()].sort((a,b)=>b[u.metric]-a[u.metric] || b.qty-a.qty);
  const custs=[...custM.values()].sort((a,b)=>b[u.metric]-a[u.metric] || b.qty-a.qty);
  const nppTot=new Map(npps.map(n=>[n.npp,n]));
  return {rows, months, prods, npps, custs, tot, nppTot, val};
}

const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('script')); document.head.appendChild(s); }); }
async function ensurePdfjs(){
  if(!window.pdfjsLib) await loadScript(PDFJS+'pdf.min.js');
  if(!globalThis.pdfjsWorker) await loadScript(PDFJS+'pdf.worker.min.js');   // runs the parser on the page itself
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS+'pdf.worker.min.js';
  return window.pdfjsLib;
}
async function pdfToSheet(file){
  const lib=await ensurePdfjs();
  const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer()), isEvalSupported:false}).promise;
  const lines=[], items=[], annots=[];
  for(let p=1;p<=doc.numPages;p++){
    const pg=await doc.getPage(p); const tc=await pg.getTextContent();
    const its=tc.items.filter(it=>it.str && it.str.trim()).map(it=>({s:it.str, x:it.transform[4], y:it.transform[5], w:it.width, h:Math.abs(it.transform[3])||8, page:p}));
    items.push(...its);
    const ls=[]; [...its].sort((a,b)=>b.y-a.y||a.x-b.x).forEach(it=>{ const L=ls.find(l=>Math.abs(l.y-it.y)<=Math.max(2,it.h*0.35)); if(L) L.items.push(it); else ls.push({y:it.y, items:[it]}); });
    ls.sort((a,b)=>b.y-a.y).forEach(l=>{ l.items.sort((a,b)=>a.x-b.x); const cells=[]; let cur=null;
      for(const it of l.items){ const gap=cur? it.x-cur.x2 : 99;
        if(cur && gap < Math.max(3.5, it.h*0.55)){ cur.s += (gap>0.6 && !/\s$/.test(cur.s) && !/^\s/.test(it.s) ? ' ' : '') + it.s; cur.x2=it.x+it.w; }
        else { cur={s:it.s, x2:it.x+it.w}; cells.push(cur); } }
      lines.push(cells.map(c=>c.s.replace(/\s+/g,' ').trim()).filter(Boolean)); });
    try{ (await pg.getAnnotations()).forEach(a=>annots.push({...a, page:p})); }catch(_){}
  }
  return {lines, items, annots};
}
async function xlsxToSheets(file){
  if(!window.XLSX) throw new Error('xlsx');

  return wb.SheetNames.map(n=>({name:n, lines:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1, raw:false, defval:''}).map(r=>r.map(v=>String(v).trim()).filter(v=>v!=='')), items:[], annots:[]}));
}
const isNumCell = s => /^\d[\d.,]*$/.test(String(s).trim());
const toNum = s => +String(s).replace(/[.,](?=\d{3}\b)/g,'').replace(',','.');
function detectKind(sheet){ const t=norm(sheet.lines.map(l=>l.join(' ')).join(' '));
  if(t.includes('customer code registration') || (t.includes('thong tin khach hang') && t.includes('pnp customer code'))) return 'reg';
  if(t.includes('phan bo san luong') && t.includes('ten cua hang')) return 'alloc';
  return null; }
const afterColon = (cells, t) => cells.length>1 && /:\s*$/.test(cells[0]) ? cells.slice(1).join(' ').trim() : t.slice(t.indexOf(':')+1).trim();
function parseAllocSheet(sheet){
  const r={rows:[], stock:{}, signed:false}; let inTable=false, tonIdx=0;
  for(const cells of sheet.lines){
    const t=cells.join(' ').replace(/\s+/g,' ').trim(), n=norm(t); if(!t) continue;
    let m;
    if((m=n.match(/ngay\s+(\d{1,2})\s+thang\s+(\d{1,2})\s+nam\s+(\d{4})/))){ r.reportDate=m[3]+'-'+pad(+m[2])+'-'+pad(+m[1]); continue; }
    if(/digitally signed|ky so boi|signed by/.test(n)) r.signed=true;
    if(/^thoi gian\s*:/.test(n)){ r.monthRaw=afterColon(cells,t); continue; }
    if(/^tinh\s*:/.test(n)){ r.province=afterColon(cells,t); continue; }
    if(/^ten nha phan phoi\s*:/.test(n)){ r.distributor=afterColon(cells,t); continue; }
    if(/^san pham\s*:/.test(n)){ r.product=afterColon(cells,t); continue; }
    if(n.includes('ten cua hang')){ inTable=true; continue; }
    if(/^(stt\b|khach hang\b|\(tam\)$)/.test(n) && r.rows.length===0) continue;
    if(/^tong cong/.test(n)){ inTable=false; const q=cells.filter(isNumCell).pop(); if(q!=null) r.totalPrinted=toNum(q); continue; }
    if(n.includes('ton kho') || n.includes('nhap kho')){ inTable=false;
      const label=cells.find(c=>/tồn kho|nhập kho/i.test(c))||''; const nums=cells.filter(c=>c!==label && isNumCell(c)); const v=nums.length? toNum(nums[nums.length-1]) : null;
      if(n.includes('nhap kho')) r.stock.import=v; else { if(tonIdx===0) r.stock.opening=v; else r.stock.closing=v; tonIdx++; }
      continue; }
    if(!inTable) continue;
    let cs=[...cells]; if(cs.length>1 && /^\d{1,3}$/.test(cs[0])) cs.shift();
    let qi=-1; for(let i=cs.length-1;i>=0;i--) if(isNumCell(cs[i])){ qi=i; break; }
    const before=qi>=0? cs.slice(0,qi) : cs, after=qi>=0? cs.slice(qi+1) : [];
    let code='';
    if(before.length>2 || (before.length>1 && /^[A-Z]{2,}[-\s]?\d{2,}$/i.test(before[0]))) code=before.shift();
    const name=before[0]||''; if(!name) continue;
    r.rows.push({storeName:name, area:before.slice(1).join(' '), qty:qi>=0? toNum(cs[qi]):0, note:after.join(' '), code});
  }
  // month: "THÁNG 08" (+ year from the text, else from report date)
  const mm=(r.monthRaw||'').match(/(\d{1,2})(?:\s*[\/\-.]\s*(\d{4}))?/);
  if(mm){ let y=mm[2]? +mm[2] : (r.reportDate? +r.reportDate.slice(0,4) : +today().slice(0,4)); const mo=+mm[1];
    if(!mm[2] && r.reportDate && mo>+r.reportDate.slice(5,7)) y--; r.month=y+'-'+pad(mo); }
  r.total=r.rows.reduce((s,x)=>s+x.qty,0);
  return r;
}
const REG_LABELS=[['ten cong ty','name'],['ten nguoi dai dien','representative'],['chuc vu','position'],['so dien thoai','phone'],['email','email'],['dia chi kinh doanh','address'],['tinh / thanh pho','city'],['tinh/thanh pho','city'],
  ['san luong du kien','expectedVolume'],['npp phu trach','distributor'],['nhan vien sales','salesRep'],['pnp customer code','code'],['ngay dang ky','regDate'],['ngay cap code','codeDate'],['trang thai','regStatus']];
function toISODate(s){ const m=String(s||'').match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/); if(m) return m[3]+'-'+pad(+m[2])+'-'+pad(+m[1]); const m2=String(s||'').match(/(\d{4})-(\d{2})-(\d{2})/); return m2? m2[0] : ''; }

    val=val.trim(); if(!val) continue;
    if(f==='expectedVolume'){ const q=val.match(/\d[\d.,]*/); if(q) d[f]=toNum(q[0]); }
    else if(f==='regDate'||f==='codeDate'){ const iso=toISODate(val); if(iso) d[f]=iso; }
    else if(f==='regStatus'){ const st=REG_ST.find(s=>norm(s)===norm(val)); if(st) d[f]=st; }
    else d[f]=val;
  }
  const all=norm(sheet.lines.map(l=>l.join(' ')).join(' '));
  if(/cn=|digitally signed|mst:/.test(all) && /xac nhan cua npp/.test(all)) d.signedNpp=true;
  // PDF checkboxes: form fields placed left of each label
  const checked=(sheet.annots||[]).filter(a=>a.checkBox || a.fieldType==='Btn').map(a=>({a, on: a.fieldValue && a.fieldValue!=='Off'}));
  for(const {a,on} of checked){ const cy=(a.rect[1]+a.rect[3])/2; const lab=(sheet.items||[]).filter(it=>it.page===a.page && Math.abs(it.y+it.h*0.35-cy)<9 && it.x>=a.rect[2]-3).sort((p,q)=>p.x-q.x)[0];
    if(!lab) continue; const b=bizN.find(([bn])=>norm(lab.s).startsWith(bn.slice(0,10))); if(b) flags[b[1]]= flags[b[1]] || on; }
  d.businessTypes=Object.keys(flags).filter(k=>flags[k]);
  d.bizDetected=Object.keys(flags).length>0;
  if(d.distributor) d.distributor=d.distributor.replace(/CỔ PHẨN/g,'CỔ PHẦN');
  if(d.code) d.code=d.code.toUpperCase();
  return d;
}

  if(['xlsx','xls','csv','ods'].includes(ext)){ try{ return await xlsxToSheets(file); } catch(e){ throw new Error('Không đọc được file Excel.'); } }

async function importTemplate(file, want){

  const found=sheets.map(s=>({s, kind:detectKind(s)})).filter(x=>x.kind);
  const hit=found.find(x=>x.kind===want) || found[0];
  if(!hit) return toast('Không nhận ra mẫu trong file. Cần mẫu “Báo cáo phân bổ sản lượng” hoặc “PNP Customer Code Registration Form”.','bad');
  if(hit.kind==='alloc'){
    const r=parseAllocSheet(hit.s);
    if(!r.rows.length) return toast('Đã nhận ra mẫu báo cáo nhưng không đọc được dòng cửa hàng nào.','bad');
    r.rows.forEach(x=>{ const c=matchCustomer(x.storeName) || (x.code && S.customers.find(k=>(k.code||'').toUpperCase()===x.code.toUpperCase())); x.customerId=c? c.id : null; });
    const dup=S.allocations.find(a=>a.month===r.month && norm(a.distributor)===norm(r.distributor||'') && norm(a.product)===norm(r.product||''));
    allocationForm(dup||null, {...r, file, replacing:!!dup});
  } else {
    const d=parseRegSheet(hit.s);
    if(!d.name) return toast('Đã nhận ra phiếu đăng ký nhưng không đọc được tên khách hàng.','bad');
    const ex=matchCustomer(d.name);
    registrationForm(ex||null, {data:d, file});
  }
  if(found.length>1 && found.some(x=>x.kind!==hit.kind)) setTimeout(()=>toast('File còn có '+(hit.kind==='alloc'?'phiếu đăng ký':'báo cáo sản lượng')+'. Nhập tiếp ở mục '+(hit.kind==='alloc'?'Đăng ký PNP':'Sản lượng')+'.'), 1600);
}

const CUST_COLS=[['ma khach hang','extCode'],['ten khach hang','name'],['ma so thue','taxCode'],['mst','taxCode'],['dia chi','address'],['ma nhan vien','salesCode'],['ten nhan vien','salesRep'],['cn_tt_dn','cnttdn'],

const CUST_TEMPLATE_HEAD=['Mã khách hàng','Tên khách hàng','Mã số thuế','Địa chỉ','Mã nhân viên','Tên nhân viên','cn_tt_dn','Trạng thái doanh nghiệp','Nhóm 1','Nhóm 2','Nhân viên hỗ trợ','Điện thoại','Thư','Mã th.toán công nợ','Ph/th th.toán (HĐĐT)','Giới hạn tiền nợ','Nhà phân phối','Khu vực','Phân loại'];
const NAME_PHRASES=['ho kinh doanh','noi ngoai that','noi that','cong ty','co phan','thuong mai','dich vu','san xuat','xay dung','thiet ke','thi cong','dai ly','cua hang','trach nhiem huu han'];
const NAME_STOP=new Set('tnhh xuong nt hkd tm dv sx xd ch furniture funiture decor va'.split(' '));
const nameToks = s => { let n=' '+norm(s).replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ')+' '; NAME_PHRASES.forEach(ph=>{ n=n.split(' '+ph+' ').join(' '); }); return n.trim().split(' ').filter(t=>t && !NAME_STOP.has(t)); };
function guessCustomer(row){
  const digits=v=>String(v||'').replace(/\D/g,'');
  if(digits(row.taxCode)){ const c=S.customers.find(k=>digits(k.taxCode) && digits(k.taxCode)===digits(row.taxCode)); if(c) return {c, how:'trùng MST'}; }
  if(row.extCode){ const c=S.customers.find(k=>(k.erpCode||'').toUpperCase()===row.extCode.toUpperCase() || (k.code||'').toUpperCase()===row.extCode.toUpperCase()); if(c) return {c, how:'trùng mã khách hàng'}; }
  const ex=matchCustomer(row.name)||matchCustomer(row.rawName); if(ex) return {c:ex, how:'trùng tên'};
  const t=nameToks(row.name); if(!t.length) return null;
  const cands=S.customers.filter(k=>[k.name,...(k.aliases||[])].some(n=>{ const ct=new Set(nameToks(n)); return ct.size && (t.every(x=>ct.has(x)) || (ct.size>=2 && [...ct].every(x=>t.includes(x)))); }));
  return cands.length===1? {c:cands[0], how:'tên gần giống, hãy kiểm tra'} : null;
}
function parseCustomerSheet(lines){
  // lines here keep empty cells, so column positions line up with the header
  const hi=lines.findIndex(r=>r.some(v=>norm(v).trim()==='ten khach hang'));
  if(hi<0) return null;
  const head=lines[hi].map(v=>norm(v).trim());
  const map=head.map(h=>{ if(!h) return null; const exact=CUST_COLS.find(([k])=>h===k); if(exact) return exact[1]; const pre=CUST_COLS.find(([k])=>k.length>5 && h.startsWith(k)); return pre? pre[1] : null; });
  const rows=[];
  for(const r of lines.slice(hi+1)){
    const o={}; map.forEach((f,i)=>{ if(!f) return; const v=String(r[i]??'').trim(); if(v!=='' && o[f]==null) o[f]=v; });
    if(!o.name) continue;
    o.rawName=o.name; const m=o.name.match(/^(S\d{1,2})\s*-\s*(.+)$/i); if(m){ o.nameGroup=m[1].toUpperCase(); o.name=m[2].trim(); }
    o.name=o.name.replace(/\s{2,}/g,' ');
    if(o.creditLimit!=null) o.creditLimit=toNum(o.creditLimit)||0;
    if(o.custType) o.custType=CUST_TYPES.find(t=>norm(t)===norm(o.custType)) || typeFromText(o.custType) || '';
    rows.push(o);
  }
  return rows;
}

    $('#oFoot').innerHTML = `<span>${list.length} đơn · Doanh thu (không tính đơn hủy): <b>${money(tot)}</b></span>${list.length>u.show?`<button class="btn sm" id="oMore">Xem thêm</button>`:''}`;
    $$('#oTbl tr[data-id]').forEach(tr=>tr.onclick=()=>openOrder(tr.dataset.id));
